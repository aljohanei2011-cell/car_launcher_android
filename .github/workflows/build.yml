name: Build APK

on:
  push:
    branches: [main]
    # تعديل التوثيق وحده لا يصنع إصداراً جديداً يصل لكل الشاشات
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".github/workflows/pr-check.yml"
  workflow_dispatch:

# بناء واحد في كل مرة، حتى لا يتداخل نشران متتاليان
concurrency:
  group: release-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # صفحة فيها خطأ صيغة تعني واجهة معطّلة على الشاشة: نوقف قبل البناء والنشر
      - name: Check web assets syntax
        run: node .github/scripts/check-assets.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # مفتاح التوقيع محفوظ مشفّراً (AES-256) في keystore/، وكلمة فك التشفير في سر المستودع KEYSTORE_PASS فقط
      - name: Restore signing key
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p signing
          OK=""
          # نجرّب السرّين (لو تبادلت القيم بالخطأ يعمل البناء أيضاً)
          for CAND in "$KEYSTORE_PASS" "$KEYSTORE_B64"; do
            P=$(printf "%s" "$CAND" | tr -d ' \r\n\t')
            [ -z "$P" ] && continue
            echo "candidate length: ${#P}"
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore/release.jks.enc -out signing/release.jks -pass "pass:$P" 2>/dev/null \
               && keytool -list -keystore signing/release.jks -storepass "$P" >/dev/null 2>&1; then
              printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=carlauncher\n" "$P" "$P" > signing/signing.properties
              OK=1; break
            fi
          done
          if [ -z "$OK" ]; then
            echo "::error::كلمة مرور مفتاح التوقيع غير صحيحة. ضع في السر KEYSTORE_PASS السطر القصير (24 حرفاً) فقط."
            exit 1
          fi

      # رقم الإصدار يزيد مع كل بناء حتى يعرف التطبيق أن هناك تحديثاً
      - name: Build signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p out
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "out/rafiq-v${{ github.run_number }}.apk"
          # رابط ثابت للتحميل المباشر: releases/latest/download/rafiq.apk
          cp "$APK" out/rafiq.apk
          # ملف واحد لكل الشاشات: الشاشات التي عليها النسخة الخفيفة القديمة تبحث عن rafiq-lite.apk،
          # فننشر الملف نفسه بهذا الاسم لتتحدّث تلقائياً إليه (نفس التوقيع ونفس التطبيق، وتبقى الإعدادات)
          cp "$APK" out/rafiq-lite.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: car-launcher-apk
          path: out/*.apk

      # إصدار على GitHub: التطبيق يتحقق منه ويحمّل التحديث من الشاشة مباشرة
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG="$(git log -1 --pretty=%s)"
          gh release create "v${{ github.run_number }}" out/*.apk \
            --title "رفيق الطريق — الإصدار ${{ github.run_number }}" \
            --notes "$MSG" --latest
