name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # مفتاح التوقيع من أسرار المستودع (لا يُحفظ في الكود حتى يكون المستودع عاماً بأمان)
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::أضف السرّين KEYSTORE_B64 و KEYSTORE_PASS في Settings > Secrets and variables > Actions"
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_B64" | base64 -d > signing/release.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=carlauncher\n" "$KEYSTORE_PASS" "$KEYSTORE_PASS" > signing/signing.properties

      # رقم الإصدار يزيد مع كل بناء حتى يعرف التطبيق أن هناك تحديثاً
      - name: Build signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/rafiq-v${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: car-launcher-apk
          path: out/*.apk

      # إصدار على GitHub: التطبيق يتحقق منه ويحمّل التحديث من الشاشة مباشرة
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG="$(git log -1 --pretty=%s)"
          gh release create "v${{ github.run_number }}" out/*.apk \
            --title "رفيق الطريق — الإصدار ${{ github.run_number }}" \
            --notes "$MSG" --latest
