name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # مفتاح التوقيع محفوظ مشفّراً (AES-256) في keystore/، وكلمة فك التشفير في سر المستودع KEYSTORE_PASS فقط
      - name: Restore signing key
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          CLEAN_PASS=$(printf "%s" "$KEYSTORE_PASS" | tr -d ' \r\n\t')
          if [ -z "$CLEAN_PASS" ]; then
            echo "::error::أضف السر KEYSTORE_PASS في Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "PASS length: ${#CLEAN_PASS} (expected 24)"
          mkdir -p signing
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore/release.jks.enc -out signing/release.jks -pass "pass:$CLEAN_PASS" 2>/dev/null \
             || ! keytool -list -keystore signing/release.jks -storepass "$CLEAN_PASS" >/dev/null 2>&1; then
            echo "::error::قيمة KEYSTORE_PASS غير صحيحة. انسخ كلمة المرور (السطر القصير) فقط."
            exit 1
          fi
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=carlauncher\n" "$CLEAN_PASS" "$CLEAN_PASS" > signing/signing.properties

      # رقم الإصدار يزيد مع كل بناء حتى يعرف التطبيق أن هناك تحديثاً
      - name: Build signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/rafiq-v${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: car-launcher-apk
          path: out/*.apk

      # إصدار على GitHub: التطبيق يتحقق منه ويحمّل التحديث من الشاشة مباشرة
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG="$(git log -1 --pretty=%s)"
          gh release create "v${{ github.run_number }}" out/*.apk \
            --title "رفيق الطريق — الإصدار ${{ github.run_number }}" \
            --notes "$MSG" --latest
