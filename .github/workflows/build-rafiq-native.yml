name: Build Rafiq Native (new launcher)

# لانشر مستقل: يُبنى من مجلد rafiq_native فقط وعلى فرعه الخاص.
# لا يلمس تطبيق «رفيق الطريق» القديم ولا يصدر له تحديثاً.
on:
  push:
    branches: [rafiq-native]
    paths:
      - "rafiq_native/**"
      - ".github/workflows/build-rafiq-native.yml"
  workflow_dispatch:

concurrency:
  group: rafiq-native-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # نفس مفتاح التوقيع الثابت (إن توفّر) حتى تُثبَّت التحديثات فوق بعضها
      - name: Restore signing key
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p rafiq_native/signing
          for CAND in "$KEYSTORE_PASS" "$KEYSTORE_B64"; do
            P=$(printf "%s" "$CAND" | tr -d ' \r\n\t')
            [ -z "$P" ] && continue
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore/release.jks.enc -out rafiq_native/signing/release.jks -pass "pass:$P" 2>/dev/null \
               && keytool -list -keystore rafiq_native/signing/release.jks -storepass "$P" >/dev/null 2>&1; then
              printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=carlauncher\n" "$P" "$P" > rafiq_native/signing/signing.properties
              echo "signing: fixed key"; break
            fi
            rm -f rafiq_native/signing/release.jks
          done

      # فحص إعلامي لمصادر البيانات (المباريات والطقس): لا يوقف البناء إن فشل
      - name: Check data sources (informational)
        continue-on-error: true
        run: |
          set +e
          D1=$(date -u +%Y%m%d); D2=$(date -u -d '+1 day' +%Y%m%d)
          for L in ksa.1 ksa.kings.cup afc.champions uefa.champions eng.1 esp.1 ita.1 ger.1 fra.1; do
            curl -s -m 20 -o /tmp/s.json -w "$L HTTP %{http_code} %{size_download}B " "https://site.api.espn.com/apis/site/v2/sports/soccer/$L/scoreboard?limit=100&dates=$D1-$D2"
            jq -r '"league=\(.leagues[0].name) events=\(.events|length) first=\(.events[0].date) \(.events[0].status.type.state)"' /tmp/s.json || echo "(not json)"
          done
          curl -s -m 20 "https://site.api.espn.com/apis/v2/sports/soccer/ksa.1/standings" | jq -r '.children[0].standings.entries[0] | "standings: \(.team.displayName) " + ([.stats[]|select(.name=="points" or .name=="gamesPlayed" or .name=="rank")|"\(.name)=\(.value)"]|join(" "))' || echo "standings: unexpected shape"
          curl -s -m 20 "https://api.open-meteo.com/v1/forecast?latitude=24.09&longitude=38.06&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,wind_direction_10m,weather_code&hourly=temperature_2m,precipitation_probability&forecast_hours=12&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max,uv_index_max,sunrise,sunset&forecast_days=5&timezone=auto" | jq -c '{cur:.current, hours:(.hourly.time|length), h0:.hourly.time[0], days:(.daily.time|length), sunrise:.daily.sunrise[0], err:.reason}'
          curl -s -m 20 "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=24.09&longitude=38.06&current=pm10" | jq -c '{pm10:.current.pm10, err:.reason}'
          curl -s -m 20 "https://marine-api.open-meteo.com/v1/marine?latitude=24.09&longitude=38.06&current=wave_height" | jq -c '{wave:.current.wave_height, err:.reason}'
          exit 0

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p rafiq_native :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(ls rafiq_native/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" out/rafiq-native.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-native-apk
          path: out/*.apk

      # إصدار تجريبي واحد ثابت الاسم (ليس «الأحدث» ولا رقمياً، فلا يراه محدّث التطبيق القديم)
      - name: Publish to fixed pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view rafiq-native >/dev/null 2>&1; then
            gh release create rafiq-native --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "رفيق الطريق الجديد (لانشر مستقل)" \
              --notes "لانشر مستقل بواجهات أندرويد الأصلية. يُثبَّت بجانب التطبيق القديم."
          fi
          gh release upload rafiq-native out/rafiq-native.apk --clobber
          gh release edit rafiq-native --notes "آخر بناء: ${{ github.run_number }} — $(git log -1 --pretty=%s)"
