<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>الأوامر الصوتية</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="page.css">
<style>
.ex{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;overflow-y:auto;scrollbar-width:none;flex:1;min-height:0}
.ex::-webkit-scrollbar{display:none}
.ex div{background:rgba(255,255,255,.05);border-radius:16px;padding:12px 16px}
.ex b{display:block;font-size:18px;color:var(--accent,#5AB0FF);margin-bottom:4px}
.ex span{display:block;font-size:17px;line-height:1.7;color:#C3D1E8}
.mic{width:120px;height:120px;border-radius:60px;border:none;background:var(--accent,#2F7BFF);display:flex;align-items:center;justify-content:center;align-self:center}
.mic svg{width:56px;height:56px}
.heard{font-size:24px;text-align:center;min-height:36px}
.act{font-size:20px;text-align:center;color:#5AD1A0;min-height:30px}
</style>
</head>
<body>
<div id="stage">
  <div class="page">
    <div class="ptop">
      <a class="icon-btn" href="index.html" aria-label="الرئيسية" style="width:48px;height:48px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></a>
      <span class="ptitle">ماذا أقول؟</span>
    </div>
    <div class="pcols" style="grid-template-columns:1.6fr 1fr">
      <div class="pcard"><span class="ph" id="hint"></span><div class="ex" id="ex"></div></div>
      <div class="pcard">
        <span class="ph">تجربة</span>
        <span class="pnote">اضغط وتكلّم. هنا نعرض ما فهمناه فقط بدون تنفيذ.</span>
        <button class="mic" id="mic" aria-label="تجربة الميكروفون"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <div class="heard" id="heard"></div>
        <div class="act" id="act"></div>
        <div class="prow" style="justify-content:center"><button class="pbtn g" id="tts">تجربة الرد بالصوت</button></div>
        <span class="pnote" id="st" style="text-align:center"></span>
      </div>
    </div>
  </div>
</div>
<script src="common.js"></script>
<script>
var prefs = loadPrefs(); applyPrefs('home', prefs);
document.body.style.background = '#0a0f1f';
var NAME = prefs.voiceName || 'رفيق';
var EX = [
  ['ملاحظة', 'ملاحظة غيّر زيت السيارة الأسبوع الجاي', 'سجّل ملاحظة اشتر خبز'],
  ['تذكير', 'ذكّرني بعد ساعة أتصل على أبوي', 'ذكّرني بكرة الساعة تسع الصبح بالفحص الدوري', 'ذكّرني أعبّي بنزين (عند التشغيل القادم)'],
  ['أقرب مكان', 'أقرب مسجد', 'أقرب محطة بنزين', 'أقرب صراف', 'أقرب قهوة'],
  ['الملاحة', 'ودّني البيت', 'ودّني الرياض', 'خذني إلى مطار الملك خالد'],
  ['رحلة سفر', 'خطط رحلة إلى بريدة'],
  ['الموسيقى', 'شغّل', 'وقّف', 'التالي', 'السابق', 'ارفع الصوت', 'وطّي الصوت'],
  ['الإذاعة', 'شغّل إذاعة القرآن', 'شغّل راديو FM'],
  ['مصروف', 'مصروف بنزين ثمانين ريال', 'دفعت غسيل خمسة وعشرين'],
  ['الصلاة', 'كم باقي على الصلاة؟', 'متى يأذن المغرب؟'],
  ['الوقت والطقس', 'كم الساعة؟', 'وش التاريخ اليوم؟', 'كيف الجو؟'],
  ['السيارة (OBD)', 'كم حرارة المحرك؟', 'البطارية'],
  ['الأذكار والقرآن', 'أذكار الصباح', 'دعاء السفر', 'وردي اليوم', 'قريت الورد'],
  ['الواجهة', 'الاستراحة', 'الوضع الليلي', 'ارفع الإضاءة', 'حرّر الذاكرة', 'افتح الإعدادات', 'افتح الخرائط', 'افتح واتساب']
];
document.getElementById('hint').textContent = 'أمثلة (يمكنك البدء بـ «يا ' + NAME + '» أو بدونها)';
document.getElementById('ex').innerHTML = EX.map(function (g) { return '<div><b>' + g[0] + '</b>' + g.slice(1).map(function (x) { return '<span>«' + x + '»</span>'; }).join('') + '</div>'; }).join('');
var sc = document.createElement('script'); sc.src = 'voice.js'; document.body.appendChild(sc);
var seq = -1, poll = null;
function $(i){ return document.getElementById(i); }
$('mic').onclick = function () {
  if (!HAS_NATIVE) { $('st').textContent = 'تعمل داخل التطبيق'; return; }
  var c = natJSON('voiceCaps') || {};
  if (!c.recognizer) { $('st').textContent = 'الشاشة لا تدعم تحويل الكلام لنص'; return; }
  if (!c.perm) { nat('voicePerm'); $('st').textContent = 'اسمح باستخدام الميكروفون ثم أعد المحاولة'; return; }
  var st0 = natJSON('voiceState') || {}; seq = st0.seq || 0;
  $('heard').textContent = 'تكلّم الآن…'; $('act').textContent = ''; $('st').textContent = '';
  nat('voiceListen', !!prefs.voiceOffline);
  clearInterval(poll);
  poll = setInterval(function () {
    var st = natJSON('voiceState'); if (!st) return;
    if (st.state === 'listening' && st.partial) $('heard').textContent = st.partial;
    if (st.seq !== seq && st.state !== 'listening') {
      clearInterval(poll);
      if (st.state === 'error' || !st.results || !st.results.length) { $('heard').textContent = ''; $('st').textContent = VERR[st.err] || 'لم أسمع شيئاً'; return; }
      var cmd = null, heard = st.results[0];
      st.results.some(function (r) { cmd = parseVoice(r, NAME); if (cmd) heard = r; return !!cmd; });
      $('heard').textContent = '«' + heard + '»';
      $('act').textContent = cmd ? 'سيُنفَّذ: ' + cmd.label : 'لم أتعرّف على الأمر';
      $('act').style.color = cmd ? '#5AD1A0' : '#F2C879';
    }
  }, 200);
};
$('tts').onclick = function () { nat('speak', 'هلا، أنا ' + NAME + '. جاهز لأوامرك.'); };
fitStage();
</script>
</body>
</html>
