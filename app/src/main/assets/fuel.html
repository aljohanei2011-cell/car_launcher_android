<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>سجل الوقود</title>
<link rel="stylesheet" href="common.css">
<style>
.page{height:100%;box-sizing:border-box;padding:22px 28px;display:flex;flex-direction:column;gap:14px;background:#0a0f1f}
.top{display:flex;align-items:center;gap:12px;height:52px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.box{border-radius:18px;background:#111a33;border:1px solid #222c4d;padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.box b{font-size:32px;direction:ltr;text-align:right}
.form{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:18px;background:#111a33;border:1px solid #222c4d;padding:12px 16px;font-size:17px}
.inp{height:50px;border-radius:14px;border:1px solid #2b3658;background:#0b1328;color:#fff;font:inherit;font-size:18px;padding:0 12px;box-sizing:border-box;width:150px}
.btn{height:50px;border-radius:14px;background:#1F5FD1;border:1px solid #6FA8FF;font-size:18px;padding:0 22px}
.chk{display:flex;align-items:center;gap:8px}
.chk input{width:24px;height:24px}
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.r{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1.2fr 60px;align-items:center;height:56px;border-radius:14px;background:#0f172d;border:1px solid #1d2747;padding:0 16px;font-size:18px}
.r.h{background:none;border:none;height:28px;color:#8F9AB8;font-size:14px}
.r span:not(:first-child){direction:ltr;text-align:right}
.x{height:40px;border-radius:12px;background:#2a1a1a;border:1px solid #5a3030;font-size:15px}
.empty{text-align:center;color:#8F9AB8;font-size:20px;padding-top:30px;line-height:1.7}
</style>
</head>
<body>
<div id="stage">
  <div class="page">
    <div class="top">
      <a class="icon-btn" href="maintenance.html" aria-label="رجوع" style="width:48px;height:48px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></a>
      <span style="font-size:26px;font-weight:700">سجل الوقود</span>
    </div>
    <div class="sum">
      <div class="box"><span class="sub">متوسط الاستهلاك</span><b id="kml">—</b><span class="sub" id="l100"></span></div>
      <div class="box"><span class="sub">آخر تعبئة كاملة</span><b id="lastKml">—</b><span class="sub">كم/لتر</span></div>
      <div class="box"><span class="sub">تكلفة هذا الشهر</span><b id="month">0</b><span class="sub">ريال</span></div>
      <div class="box"><span class="sub">تكلفة الكيلومتر</span><b id="perKm">—</b><span class="sub">ريال/كم</span></div>
    </div>
    <div class="form">
      <span>لترات</span><input class="inp" id="lit" type="number" step="0.01" inputmode="decimal">
      <span>المبلغ</span><input class="inp" id="cost" type="number" step="0.01" inputmode="decimal">
      <span>العداد</span><input class="inp" id="odo" type="number" inputmode="numeric">
      <label class="chk"><input type="checkbox" id="full" checked>تعبئة كاملة</label>
      <button class="btn" id="add" style="margin-right:auto">إضافة</button>
    </div>
    <div class="r h"><span>التاريخ</span><span>لتر</span><span>ريال</span><span>العداد</span><span>كم/لتر</span><span></span></div>
    <div class="list" id="list"></div>
  </div>
</div>
<script src="common.js"></script>
<script>
var prefs = loadPrefs(); applyPrefs('home', prefs);
document.body.style.background = '#0a0f1f';
var KEY = 'carlauncher.fuel';
function load(){ try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
function save(l){ try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (e) {} }
var items = load();
var odoNow = carOdometer();
if (odoNow !== null) document.getElementById('odo').value = odoNow;

/* الاستهلاك بين تعبئتين كاملتين: (المسافة) ÷ (اللترات المضافة بعد التعبئة الكاملة السابقة) */
function compute(){
  var sorted = items.slice().sort(function (a, b) { return a.odo - b.odo; });
  var lastFull = null, litersSince = 0, totalKm = 0, totalL = 0;
  sorted.forEach(function (it) {
    it._kml = null;
    if (lastFull !== null) litersSince += it.liters;
    if (it.full) {
      if (lastFull !== null && it.odo > lastFull.odo && litersSince > 0) {
        it._kml = (it.odo - lastFull.odo) / litersSince;
        totalKm += it.odo - lastFull.odo; totalL += litersSince;
      }
      lastFull = it; litersSince = 0;
    }
  });
  return { sorted: sorted, kml: totalL > 0 ? totalKm / totalL : null, totalKm: totalKm };
}
function render(){
  var c = compute();
  document.getElementById('kml').textContent = c.kml ? c.kml.toFixed(1) + ' كم/لتر' : '—';
  document.getElementById('l100').textContent = c.kml ? (100 / c.kml).toFixed(1) + ' لتر لكل 100 كم' : 'يحتاج تعبئتين كاملتين';
  var withK = c.sorted.filter(function (x) { return x._kml; });
  document.getElementById('lastKml').textContent = withK.length ? withK[withK.length - 1]._kml.toFixed(1) : '—';
  var now = new Date(), ms = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  var mc = items.filter(function (x) { return x.date >= ms; }).reduce(function (s, x) { return s + (x.cost || 0); }, 0);
  document.getElementById('month').textContent = Math.round(mc).toLocaleString('en');
  var cost = 0, l = 0; items.forEach(function (x) { cost += x.cost || 0; l += x.liters; });
  document.getElementById('perKm').textContent = c.kml && l > 0 ? ((cost / l) / c.kml).toFixed(2) : '—';
  var L = document.getElementById('list'); L.innerHTML = '';
  if (!items.length) { L.innerHTML = '<div class="empty">أضف كل تعبئة: اللترات والمبلغ وقراءة العداد.<br>الاستهلاك يُحسب بين تعبئتين كاملتين.</div>'; return; }
  c.sorted.slice().reverse().forEach(function (it) {
    var r = document.createElement('div'); r.className = 'r';
    [fmt({ day: 'numeric', month: 'short', year: 'numeric' }, 'ar-u-nu-latn', new Date(it.date)) + (it.full ? '' : ' (جزئية)'),
     it.liters.toFixed(1), it.cost ? it.cost.toFixed(0) : '—', it.odo.toLocaleString('en'), it._kml ? it._kml.toFixed(1) : '—'
    ].forEach(function (t) { var s = document.createElement('span'); s.textContent = t; r.appendChild(s); });
    var x = document.createElement('button'); x.className = 'x'; x.textContent = 'حذف';
    x.onclick = function () { items = items.filter(function (y) { return y !== it; }); save(items); render(); };
    r.appendChild(x);
    L.appendChild(r);
  });
}
document.getElementById('add').onclick = function () {
  var lit = +document.getElementById('lit').value, cost = +document.getElementById('cost').value, odo = +document.getElementById('odo').value;
  if (!lit || !odo) return;
  items.push({ date: Date.now(), liters: lit, cost: cost || 0, odo: odo, full: document.getElementById('full').checked });
  save(items);
  document.getElementById('lit').value = ''; document.getElementById('cost').value = '';
  render();
};
render();
fitStage();
</script>
</body>
</html>
