<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>قالب الرحلة</title>
<link rel="stylesheet" href="common.css">
<style>
.page{height:100%;box-sizing:border-box;padding:22px 28px;display:flex;flex-direction:column;gap:16px;background:#0a0f1f}
.top{display:flex;justify-content:space-between;align-items:center;height:52px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:14px}
.tile{border-radius:22px;background:#111a33;border:1px solid #222c4d;padding:18px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
.lbl{font-size:18px;color:#8FD3C4}
.big{font-size:92px;font-weight:700;line-height:1;direction:ltr;font-variant-numeric:tabular-nums}
.st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.st div{height:84px;border-radius:16px;border:1px solid #222c4d;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 14px;box-sizing:border-box}
</style>
</head>
<body>
<div id="stage">
  <div class="page">
    <div class="top">
      <div style="display:flex;align-items:center;gap:12px">
        <a class="icon-btn" href="index.html" aria-label="العودة للرئيسية" style="width:48px;height:48px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></a>
        <span style="font-size:26px;font-weight:700">قالب الرحلة</span>
      </div>
      <span id="mode" class="sub" style="font-size:14px;padding:5px 12px;border-radius:14px;border:1px solid #2b3658">جارٍ البحث عن GPS…</span>
    </div>

    <div class="grid">
      <div class="tile" style="grid-row:span 2">
        <span class="lbl">عداد الرحلة</span>
        <div>
          <span class="big" id="km">0.0</span><span style="font-size:30px;color:#B9C3DC"> كم</span>
          <div class="sub" style="font-size:18px;margin-top:6px">المسافة منذ البداية</div>
        </div>
        <div style="display:flex;justify-content:space-between;direction:ltr;font-variant-numeric:tabular-nums">
          <div style="display:flex;flex-direction:column"><span id="dur" style="font-size:30px;font-weight:700">00:00</span><span style="font-size:14px;color:#8F9AB8;direction:rtl">المدة</span></div>
          <div style="display:flex;flex-direction:column"><span id="avg" style="font-size:30px;font-weight:700">—</span><span style="font-size:14px;color:#8F9AB8;direction:rtl">متوسط كم/س</span></div>
        </div>
        <button id="reset" style="height:56px;border-radius:16px;background:#1b2748;border:1px solid #2b3658;font-size:18px">تصفير العداد</button>
      </div>

      <div class="tile">
        <span class="lbl">تنبيه الاستراحة</span>
        <div style="display:flex;align-items:center;justify-content:center;gap:16px">
          <svg width="110" height="110" viewBox="0 0 110 110" aria-hidden="true">
            <circle cx="55" cy="55" r="44" fill="none" stroke="#252e4d" stroke-width="10"/>
            <circle id="restArc" cx="55" cy="55" r="44" fill="none" stroke="#E8C061" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 276" transform="rotate(-90 55 55)"/>
          </svg>
          <div style="display:flex;flex-direction:column"><span id="drive" style="font-size:40px;font-weight:700;direction:ltr">00:00</span><span class="sub" style="font-size:14px">قيادة متواصلة</span></div>
        </div>
        <span class="sub" style="font-size:14px">تُنبَّه كل ساعتين</span>
      </div>

      <div class="tile">
        <span class="lbl">السرعة الحالية</span>
        <div style="display:flex;align-items:baseline;gap:10px;direction:ltr"><span id="speed" style="font-size:76px;font-weight:700;line-height:1">0</span><span class="sub" style="font-size:20px">كم/س</span></div>
        <div style="height:8px;border-radius:4px;background:#252e4d;overflow:hidden"><div id="speedBar" style="width:0;height:100%;background:#E8C061"></div></div>
      </div>

      <div class="tile" style="grid-column:span 2;gap:12px">
        <span class="lbl">حالة البطاقات</span>
        <div class="st">
          <div style="background:#15302e"><span style="font-size:17px;font-weight:700">الصلاة</span><span style="font-size:14px;color:#8FD3C4">جاهزة الآن</span></div>
          <div style="background:#2a2414"><span style="font-size:17px;font-weight:700">الطقس</span><span style="font-size:14px;color:#F2C879">تحتاج إنترنت</span></div>
          <div id="gpsCard" style="background:#2a2414"><span style="font-size:17px;font-weight:700">الموقع</span><span id="gpsState" style="font-size:14px;color:#F2C879">تحتاج الموقع</span></div>
          <div style="background:#1b2748"><span style="font-size:17px;font-weight:700">حالة السيارة</span><span style="font-size:14px;color:#B9C3DC">تحتاج OBD</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
var prefs = loadPrefs();
applyPrefs('home', prefs);
document.body.style.background = '#0a0f1f';

var STATE_KEY = 'carlauncher.trip';
var trip = { km: 0, sec: 0 };
try { var raw = localStorage.getItem(STATE_KEY); if (raw) trip = JSON.parse(raw); } catch (e) {}

var gps = { active: false, lastLat: null, lastLon: null, speedKmh: 0, lastFixAt: 0 };

function pad(x){ return (x < 10 ? '0' : '') + x; }
function fmtDur(s){ return pad(Math.floor(s/3600)) + ':' + pad(Math.floor((s%3600)/60)); }
function save(){ try { localStorage.setItem(STATE_KEY, JSON.stringify(trip)); } catch (e) {} }

/* المسافة بين نقطتين بالكيلومتر (هافرساين) */
function distKm(a, b, c, d){
  var R = 6371, r = Math.PI / 180;
  var dLat = (c - a) * r, dLon = (d - b) * r;
  var h = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(a*r) * Math.cos(c*r) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

function onFix(pos){
  var c = pos.coords;
  gps.active = true; gps.lastFixAt = Date.now();
  // السرعة من GPS بالمتر/ثانية، تتحول إلى كم/س
  gps.speedKmh = (c.speed && c.speed > 0) ? c.speed * 3.6 : 0;
  // نُضيف المسافة فقط عند دقة جيدة وحركة فعلية، لتجنب الانجراف
  if (c.accuracy <= 30 && gps.lastLat !== null) {
    var d = distKm(gps.lastLat, gps.lastLon, c.latitude, c.longitude);
    if (d >= 0.005) { trip.km += d; gps.lastLat = c.latitude; gps.lastLon = c.longitude; }
  } else if (gps.lastLat === null && c.accuracy <= 30) {
    gps.lastLat = c.latitude; gps.lastLon = c.longitude;
  }
  document.getElementById('gpsState').textContent = 'GPS متصل';
  document.getElementById('gpsCard').style.background = '#15302e';
  document.getElementById('mode').textContent = 'GPS حقيقي';
}
function onFixError(){
  if (gps.active) return;
  document.getElementById('mode').textContent = 'بيانات تجريبية (لا يوجد GPS)';
  document.getElementById('gpsState').textContent = 'تحتاج الموقع';
  document.getElementById('gpsCard').style.background = '#2a2414';
}

if (navigator.geolocation) {
  navigator.geolocation.watchPosition(onFix, onFixError, { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });
} else {
  onFixError();
}

function render(){
  var speed = gps.active ? Math.round(gps.speedKmh) : 86;
  document.getElementById('km').textContent = trip.km.toFixed(1);
  document.getElementById('dur').textContent = fmtDur(trip.sec);
  document.getElementById('avg').textContent = trip.sec > 0 ? String(Math.round(trip.km / (trip.sec / 3600))) : '—';
  document.getElementById('drive').textContent = fmtDur(trip.sec % 7200);
  document.getElementById('restArc').setAttribute('stroke-dasharray', Math.round(276 * (trip.sec % 7200) / 7200) + ' 276');
  document.getElementById('speed').textContent = speed;
  document.getElementById('speedBar').style.width = Math.min(100, Math.round(speed / 180 * 100)) + '%';
}
setInterval(function () {
  // المدة تزيد عند الحركة فقط مع GPS، وفي المحاكاة دائماً
  var moving = gps.active ? gps.speedKmh > 3 : true;
  if (moving) {
    trip.sec += 1;
    if (!gps.active) trip.km += 86 / 3600;
  }
  // GPS غائب منذ 20 ثانية: نعتبره غير متصل
  if (gps.active && Date.now() - gps.lastFixAt > 20000) { gps.active = false; onFixError(); }
  save(); render();
}, 1000);
document.getElementById('reset').onclick = function () { trip = { km: 0, sec: 0 }; gps.lastLat = null; save(); render(); };
render();
fitStage();
</script>
</body>
</html>
