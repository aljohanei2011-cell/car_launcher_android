<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>فحص شامل</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="page.css">
<style>
.list{display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow-y:auto;flex:1;min-height:0;scrollbar-width:none;align-content:start}
.list::-webkit-scrollbar{display:none}
.it{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);min-height:64px;box-sizing:border-box}
.ic{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex:none}
.ok .ic{background:rgba(90,209,160,.18);color:#5AD1A0}.warn .ic{background:rgba(242,200,121,.18);color:#F2C879}.bad .ic{background:rgba(255,107,90,.18);color:#FF6B5A}.wait .ic{background:rgba(255,255,255,.1);color:#9FB0CC}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:18px}.tx span{display:block;font-size:15px;color:#9FB0CC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fix{height:44px;padding:0 14px;border-radius:12px;border:1px solid #6FA8FF;background:#1F5FD1;color:#fff;font:inherit;font-size:16px;flex:none}
.sumr{display:flex;gap:12px;font-size:20px;align-items:center}
.sumr b{font-size:26px}
</style>
</head>
<body>
<div id="stage">
  <div class="page">
    <div class="ptop">
      <a class="icon-btn" href="index.html" aria-label="الرئيسية" style="width:48px;height:48px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></a>
      <span class="ptitle">فحص شامل للشاشة</span>
      <div class="sumr" style="margin-right:auto" id="sum"></div>
      <button class="pbtn" id="again" style="margin-right:12px">إعادة الفحص</button>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>
<script src="common.js"></script>
<script>
var prefs = loadPrefs(); applyPrefs('home', prefs);
document.body.style.background = '#0a0f1f';
function $(id){ return document.getElementById(id); }
/* كل فحص: [العنوان، دالة ترجع {s: ok|warn|bad, t: نص، fix: [زر، دالة]}] */
var CHECKS = [
  ['الواجهة الافتراضية', function () { var d = nat('isDefaultHome'); return d ? { s: 'ok', t: 'رفيق الطريق هو الواجهة الافتراضية' } : { s: 'bad', t: 'الشاشة قد ترجع لواجهتها الأصلية', fix: ['جعله الافتراضي', function () { nat('makeDefaultHome'); }] }; }],
  ['إذن الموقع', function () { return nat('hasLocation') ? { s: 'ok', t: 'ممنوح' } : { s: 'bad', t: 'مطلوب للصلاة بموقعك والرحلة والسرعة', fix: ['السماح', function () { nat('askLocation'); }] }; }],
  ['إشارة GPS', function () { var t = natJSON('trip') || {}; return t.gps ? { s: 'ok', t: 'متصلة' + (typeof t.lat === 'number' ? ' (' + t.lat.toFixed(3) + '، ' + t.lng.toFixed(3) + ')' : '') } : { s: 'warn', t: 'لا توجد إشارة الآن (طبيعي داخل المواقف)', fix: ['إعدادات الموقع', function () { nat('openSystem', 'gps'); }] }; }],
  ['الإنترنت', function () { var s = natJSON('status') || {}; return s.internet ? { s: 'ok', t: 'متصل' } : { s: 'warn', t: 'غير متصل (الطقس والتحديث يحتاجانه فقط)', fix: ['الواي فاي', function () { nat('openPanel', 'wifi'); }] }; }],
  ['الطقس', function () { if (!prefs.weatherOn) return { s: 'warn', t: 'مُطفأ من الإعدادات' }; var w = weatherData(); return w.at ? { s: Date.now() - w.at < 3 * 3600000 ? 'ok' : 'warn', t: 'آخر تحديث ' + agoText(w.at) } : { s: 'warn', t: 'لم يُحدَّث بعد', fix: ['تحديث', function () { nat('weatherRefresh', LAT, LNG); }] }; }],
  ['الوصول إلى الإشعارات', function () { var m = natJSON('media'); return m && m.access !== false ? { s: 'ok', t: 'مفعّل (الموسيقى والمكالمات)' } : { s: 'bad', t: 'مطلوب لعرض الموسيقى والمكالمات', fix: ['تفعيل', function () { nat('openNotificationAccess'); }] }; }],
  ['تعديل إعدادات النظام', function () { return nat('canWriteSettings') ? { s: 'ok', t: 'ممنوح (السطوع)' } : { s: 'warn', t: 'مطلوب للتحكم بالسطوع فقط', fix: ['السماح', function () { nat('openWriteSettings'); }] }; }],
  ['الظهور فوق التطبيقات', function () { return nat('canOverlay') ? { s: 'ok', t: 'ممنوح (إعادة الفتح التلقائي)' } : { s: 'warn', t: 'يفيد لإعادة فتح الواجهة إن أُغلقت', fix: ['السماح', function () { nat('openOverlaySettings'); }] }; }],
  ['تثبيت التحديثات', function () { return nat('canInstall') ? { s: 'ok', t: 'ممنوح' } : { s: 'warn', t: 'مطلوب للتحديث من الشاشة', fix: ['السماح', function () { nat('openInstallSettings'); }] }; }],
  ['الذاكرة', function () { var m = memText(); if (!m) return { s: 'warn', t: 'غير معروفة' }; return { s: m.pct > 88 ? 'bad' : m.pct > 75 ? 'warn' : 'ok', t: m.used + ' من ' + m.total + ' جيجا مستخدمة (' + m.pct + '%)', fix: m.pct > 75 ? ['تحرير', function () { nat('freeRam'); }] : null }; }],
  ['استقرار الواجهة (7 أيام)', function () { var k = nat('memKillsWeek'); return k === null ? { s: 'warn', t: '—' } : k === 0 ? { s: 'ok', t: 'لم يغلقها النظام' } : { s: k < 3 ? 'warn' : 'bad', t: 'أغلقها النظام ' + k + ' مرة لنقص الذاكرة', fix: perfOn(prefs) ? null : ['وضع الأداء', function () { prefs.perf = 'on'; savePrefs(prefs); _prefsCache = null; applyPrefs('home', prefs); }] }; }],
  ['سرعة الرسم', function (done) { measureFps(1500, function (f) { done({ s: f >= 50 ? 'ok' : f >= 35 ? 'warn' : 'bad', t: f + ' إطار/ث' + (f < 45 && !perfOn(prefs) ? ' — وضع الأداء سيفيد' : '') }); }); return null; }],
  ['محرك الصفحات', function () { var mv = navigator.userAgent.match(/Chrome\/(\d+)/), v = mv ? +mv[1] : 0; return { s: v >= 80 ? 'ok' : v >= 70 ? 'warn' : 'bad', t: 'Chrome ' + (v || '؟') + (v < 80 ? ' — يُفضَّل تحديث Android System WebView' : '') }; }],
  ['الأوامر الصوتية', function () { var c = natJSON('voiceCaps') || {}; if (!c.recognizer) return { s: 'warn', t: 'خدمة الكلام غير متوفرة في هذه الشاشة' }; return { s: c.on ? 'ok' : 'warn', t: (c.on ? 'مفعّلة' : 'مدعومة ومطفأة') + ' · ميكروفون ' + (c.mic ? '✓' : '✗') + ' · نطق عربي ' + (c.tts === 'ok' ? '✓' : '؟') }; }],
  ['البلوتوث', function () { var s = natJSON('status') || {}; return { s: s.bt === 'connected' ? 'ok' : s.bt === 'on' ? 'ok' : 'warn', t: s.bt === 'connected' ? 'متصل بجهاز' : s.bt === 'on' ? 'يعمل' : 'مُطفأ أو غير متاح' }; }],
  ['قطعة OBD', function () { var o = natJSON('obd') || {}, d = natJSON('obdDevices') || []; if (o.state === 'on') return { s: 'ok', t: 'متصلة: ' + o.dev }; var lk = d.filter(function (x) { return x.likely; }); return lk.length ? { s: 'warn', t: 'مقترنة وغير متصلة: ' + lk[0].name, fix: ['اتصال', function () { nat('obdStart', lk[0].addr); }] } : { s: 'warn', t: 'لا توجد قطعة (اختياري)' }; }],
  ['الإصدار', function () { var v = natJSON('version') || {}, u = natJSON('updateState') || {}; return { s: u.phase === 'available' ? 'warn' : 'ok', t: 'الإصدار ' + (v.name || '—') + ' · قناة ' + (nat('updChannel') === 'beta' ? 'تجريبية' : 'ثابتة') + (u.phase === 'available' ? ' · يوجد تحديث ' + u.latest : '') }; }],
  ['المدينة والمواقيت', function () { var np = nextPrayer(new Date()); return { s: 'ok', t: cityLabel() + ' · ' + np.name + ' ' + np.timeFmt }; }]
];
function run(){
  if (!HAS_NATIVE) { $('list').innerHTML = '<div class="pnote">الفحص يعمل داخل التطبيق.</div>'; }
  var L = $('list'); L.innerHTML = ''; var res = [];
  CHECKS.forEach(function (c, i) {
    var row = document.createElement('div'); row.className = 'it wait'; row.innerHTML = '<div class="ic">…</div><div class="tx"><b>' + c[0] + '</b><span>جارٍ الفحص</span></div>'; L.appendChild(row);
    var show = function (r) {
      res[i] = r.s; row.className = 'it ' + r.s;
      row.innerHTML = '<div class="ic">' + (r.s === 'ok' ? '✓' : r.s === 'bad' ? '✗' : '!') + '</div><div class="tx"><b>' + c[0] + '</b><span>' + r.t + '</span></div>';
      if (r.fix) { var b = document.createElement('button'); b.className = 'fix'; b.textContent = r.fix[0]; b.onclick = function () { r.fix[1](); setTimeout(run, 1500); }; row.appendChild(b); }
      summary(res);
    };
    setTimeout(function () { var r; try { r = c[1](show); } catch (e) { r = { s: 'warn', t: 'تعذّر الفحص' }; } if (r) show(r); }, 60 * i);
  });
}
function summary(res){
  var ok = 0, w = 0, b = 0; res.forEach(function (s) { if (s === 'ok') ok++; else if (s === 'bad') b++; else if (s) w++; });
  $('sum').innerHTML = '<span style="color:#5AD1A0">✓ <b>' + ok + '</b></span><span style="color:#F2C879">! <b>' + w + '</b></span><span style="color:#FF6B5A">✗ <b>' + b + '</b></span>';
}
$('again').onclick = run;
window.onPageResume = run;
run();
fitStage();
</script>
</body>
</html>
