<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>شاشة الاستراحة</title>
<link rel="stylesheet" href="common.css">
<style>
#stage{background:#000}
.layer{position:absolute;top:0;right:0;bottom:0;left:0}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;box-sizing:border-box;padding:22px 40px 24px}
.top{display:flex;justify-content:space-between;align-items:center;height:56px;flex:none}
.mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.clockBox{display:flex;flex-direction:column;align-items:center;gap:8px}
svg.layer{width:100%;height:100%}
.clock{font-weight:700;line-height:1;direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:2px;white-space:nowrap}
.dates{display:flex;gap:18px;justify-content:center;font-size:22px;color:#E4E8F2;white-space:nowrap}
.dua{width:100%;max-width:1100px;height:64px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Alyamama','Thmanyah',serif;transition:opacity .6s}
.dua .mq{white-space:nowrap}
.remind{font-size:19px;color:#F2C879;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:1000px;min-height:26px}
.wird{display:flex;align-items:center;gap:14px;padding:10px 22px;border-radius:20px;background:rgba(0,0,0,.35);border:1px solid rgba(242,200,121,.35);font-size:20px;max-width:1000px;white-space:nowrap;overflow:hidden}
.wird .wl{color:#F2C879;font-size:15px}
.wird .ws{color:#C9CFDD;font-size:14px}
.wird .wt{overflow:hidden;text-overflow:ellipsis}
.next{display:flex;align-items:center;justify-content:center;gap:20px}
.foot{display:flex;gap:14px;justify-content:center;flex:none;height:64px}
.btn{height:60px;border-radius:30px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:500;padding:0 26px;color:#fff}
.hidden{display:none!important}

/* ===== الأنماط ===== */
.S-classic .clock{font-size:150px}
.S-clock .clock{font-size:250px}
.S-clock .dates{font-size:26px}
/* خافت (ليلاً تلقائياً أو دائماً) لنمط «ساعة فقط» */
.dim #bg,.dim #vid{opacity:0!important}
.dim .clock{color:#9a6f2c;font-weight:500}
.dim .dates,.dim .dua,.dim .next,.dim .top{color:#6b5226!important;opacity:.85}
.dim .next *,.dim .top *{color:#6b5226!important;text-shadow:none!important}
.dim .btn{background:none;border-color:#3a2c14;color:#6b5226}
.dim .shade{display:none}
.S-pattern .clock{font-size:110px;color:#F3E2B3}
.S-pattern .duaBox{border:2px solid rgba(232,192,97,.6);border-radius:30px;padding:26px 40px;background:rgba(6,30,32,.75);width:min(1050px,100%);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:8px}
.S-gallery .clockBox{padding:18px 40px;border-radius:28px}
.S-gallery .duaBox,.S-gallery .next{background:rgba(0,0,0,.45);border-radius:20px;padding:8px 22px;box-sizing:border-box}
.S-gallery .duaBox{width:min(980px,100%)}
.S-gallery .clock{font-size:110px}
.S-gallery .mid{justify-content:center;gap:14px}
/* فاخرة: ساعة كبيرة وشريط الصلوات الخمس */
.S-lux .clock{font-size:190px;font-weight:300;letter-spacing:0;color:#F6EBD3;text-shadow:0 0 30px rgba(231,199,122,.25)}
.S-lux .dates{color:#E7D6B0}
.S-lux .mid{justify-content:flex-end;gap:22px}
.strip{display:flex;gap:0;padding:8px;border-radius:26px;background:rgba(10,10,12,.45);border:1px solid rgba(231,199,122,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.strip div{min-width:150px;padding:10px 18px;text-align:center;border-radius:18px;display:flex;flex-direction:column;gap:2px}
.strip div+div{border-right:1px solid rgba(255,255,255,.12)}
.strip b{font-size:21px;font-weight:600;color:#E9E2D2}.strip span{font-size:24px;direction:ltr;color:#fff;font-variant-numeric:tabular-nums}
.strip .on{background:rgba(231,199,122,.16);border:1px solid rgba(231,199,122,.7);box-shadow:0 0 18px rgba(231,199,122,.25)}
.strip .on b,.strip .on span{color:#F2C879}
body.perf .strip{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(10,10,12,.75)}
#vid{object-fit:cover;width:100%;height:100%;transition:opacity .6s}
#vshade{background:#000;pointer-events:none}
/* فوق الفيديو: مكان الساعة وشكلها */
.vp-tl .clockBox{position:absolute;top:84px;left:40px;align-items:flex-start}
.vp-tl .clock{font-size:96px!important}
.vp-tl .mid{justify-content:flex-end;gap:12px}
.vp-tl .dates{font-size:18px}
.vp-bc .mid{justify-content:flex-end}
.vp-bc .clock{font-size:130px!important}
.vl-thin .clock{font-weight:300;letter-spacing:0}
.vl-capsule .clockBox{padding:12px 40px 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03))}
.vl-capsule .clock{font-weight:300}
.vl-none .clock{display:none}
#luxClk{display:none}.vl-lux #luxClk{display:block;height:260px}.vl-lux .clock{display:none}
.vp-tl.vl-lux #luxClk{height:160px}
/* لوحة سريعة بالضغط المطوّل */
#vq{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:30;display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:24px;background:rgba(10,14,26,.82);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:17px}
#vq button{height:52px;min-width:60px;padding:0 14px;border-radius:16px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:16px}
#vq button.on{background:#2F7BFF;border-color:#6FA8FF}
.S-nap .clock{font-size:180px}
.napOpts{display:flex;gap:14px}
.napOpts button{height:70px;min-width:120px;border-radius:22px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.35);font-size:24px;color:#fff}
.napOpts button.on{background:#2F7BFF;border-color:#6FA8FF}
#gallery img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;transition:opacity 1.5s}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" alt="">
  <video id="vid" class="layer" muted loop playsinline style="display:none"></video>
  <script>(function(){var b=document.getElementById('bg'),s=null,c='';try{s=localStorage.getItem('carlauncher.bg.rest');c=localStorage.getItem('carlauncher.bodycls')||'';}catch(e){}if(s)b.src=s;if(c)document.body.className+=' '+c;})();</script>
  <div class="layer" id="gallery"></div>
  <svg class="layer" id="pattern" style="display:none" aria-hidden="true">
    <defs>
      <pattern id="pt" width="80" height="80" patternUnits="userSpaceOnUse">
        <rect width="80" height="80" fill="#062024"/>
        <g fill="none" stroke="rgba(232,192,97,.32)" stroke-width="1.4">
          <rect x="20" y="20" width="40" height="40"/>
          <rect x="20" y="20" width="40" height="40" transform="rotate(45 40 40)"/>
          <circle cx="40" cy="40" r="9"/>
          <path d="M0 0 20 20M80 0 60 20M0 80 20 60M80 80 60 60M40 0v11.7M40 80V68.3M0 40h11.7M80 40H68.3"/>
        </g>
      </pattern>
      <radialGradient id="vg" cx="50%" cy="50%" r="70%"><stop offset="40%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".75"/></radialGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#pt)"/>
    <rect width="100%" height="100%" fill="url(#vg)"/>
  </svg>
  <div class="layer" id="vshade" style="display:none"></div>
  <div class="shade" id="shade"></div>
  <div class="wrap">
    <div class="top">
      <div class="logo" id="brand" aria-label="اسم السيارة"></div>
      <div style="font-size:19px;color:#E4E8F2" id="title">وضع الاستراحة</div>
    </div>
    <div class="mid" id="mid">
      <div class="clockBox" id="clockBox">
        <div id="luxClk"></div>
        <div class="clock" id="clock"></div>
        <div class="dates" id="dates"><span id="hijri"></span><span style="opacity:.5">|</span><span id="greg"></span></div>
      </div>
      <div class="duaBox" id="duaBox">
        <div class="dua" id="dua"></div>
        <div class="wird" id="wird"><span class="wl">ورد اليوم</span><span class="wt" id="wirdText"></span><span class="ws" id="wirdSrc"></span></div>
      </div>
      <div class="remind" id="remind"></div>
      <div class="strip hidden" id="strip"></div>
      <div class="next" id="next">
        <span style="font-size:18px;color:#F2C879">الصلاة القادمة</span>
        <span id="nextName" style="font-size:34px;font-weight:600"></span>
        <span style="font-size:30px;opacity:.4">|</span>
        <span id="nextTime" style="font-size:36px;font-weight:700"></span>
        <span id="nextDiff" class="sub" style="font-size:20px"></span>
      </div>
      <div id="nap" class="hidden" style="display:flex;flex-direction:column;align-items:center;gap:16px">
        <div class="napOpts" id="napOpts"></div>
        <div id="napMsg" class="sub" style="font-size:20px;min-height:28px"></div>
      </div>
    </div>
    <div class="foot">
      <a class="btn glass" href="index.html">الرئيسية</a>
      <button class="btn glass" id="styleBtn">تغيير النمط</button>
      <a class="btn glass" href="azkar.html">الأذكار</a>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
var prefs = loadPrefs();
applyPrefs('rest', prefs);
var STYLES = [['classic', 'كلاسيكي'], ['clock', 'ساعة فقط'], ['lux', 'فاخرة'], ['pattern', 'زخرفة'], ['gallery', 'معرض صوري'], ['nap', 'قيلولة']];
var style = (location.search.match(/style=(\w+)/) || [])[1] || prefs.restStyle || 'classic';
if (style === 'night') style = 'clock';
if (!STYLES.some(function (x) { return x[0] === style; })) style = 'classic';
var show = Object.assign({ dua: true, wird: true, remind: true, prayer: true, date: true }, prefs.restShow || {});
function $(id){ return document.getElementById(id); }
function vis(id, on){ $(id).classList.toggle('hidden', !on); }

function applyStyle(){
  STYLES.forEach(function (s) { document.body.classList.remove('S-' + s[0]); });
  document.body.classList.add('S-' + style);
  var pattern = style === 'pattern', gallery = style === 'gallery', lux = style === 'lux';
  var video = setVideo(!pattern && !gallery);
  $('bg').style.display = (pattern || gallery || video) ? 'none' : '';
  $('pattern').style.display = pattern ? '' : 'none';
  $('gallery').style.display = gallery ? '' : 'none';
  $('clockBox').className = 'clockBox' + (gallery ? ' glass' : '');
  $('title').textContent = (STYLES.filter(function (s) { return s[0] === style; })[0] || STYLES[0])[1];
  // ما يظهر في كل نمط (ومع اختياراتك من الإعدادات)
  var minimal = style === 'clock' || lux;
  vis('dates', show.date);
  vis('dua', show.dua && style !== 'clock' && style !== 'nap' && !lux);
  vis('wird', show.wird && !minimal && style !== 'gallery' && style !== 'nap');
  vis('remind', show.remind && style !== 'clock' && style !== 'nap');
  vis('next', show.prayer && style !== 'clock' && !lux);
  vis('strip', lux);
  vis('nap', style === 'nap');
  $('duaBox').classList.toggle('hidden', $('dua').classList.contains('hidden') && $('wird').classList.contains('hidden'));
  if (gallery) startGallery(); else stopGallery();
  if (style === 'nap') renderNap();
  applyDim();
  setTimeout(setDua, 50);
}
/* «ساعة فقط» تخفت ليلاً تلقائياً (أو دائماً) حسب الإعدادات */
function applyDim(){
  var m = prefs.restDim || 'night';
  document.body.classList.toggle('dim', style === 'clock' && (m === 'always' || (m === 'night' && isNight())));
}
/* الخلفية المتحركة: فيديو يرفعه المستخدم من جواله (لا يعمل في النسخة الخفيفة) */
var _vidPick = null;
function videoList(){ try { return JSON.parse(nat('videos') || '[]'); } catch (e) { return []; } }
/* أي فيديو يُعرض: تبديل عشوائي، أو فيديو الليل، أو الفيديو المختار */
function pickVideo(){
  var list = videoList(); if (!list.length) return null;
  var by = function (n) { return list.filter(function (x) { return x.name === n; })[0]; };
  if (prefs.restVideoRotate && list.length > 1) { if (!_vidPick) _vidPick = list[Math.floor(Math.random() * list.length)]; return _vidPick; }
  if (isNight() && prefs.restVideoNight && by(prefs.restVideoNight)) return by(prefs.restVideoNight);
  return prefs.restVideo ? by(prefs.restVideo) || null : null;
}
/* حماية الذاكرة: إذا أغلق النظام الواجهة والفيديو يعمل مؤخراً، أو الذاكرة المتاحة قليلة، نعرض صورة بدل الفيديو */
var _vidSafe = (function () {
  if (!HAS_NATIVE || LITE) return true;
  var m = natJSON('memInfo') || {}, killed = nat('restKilledRecently') === true;
  if (killed || (m.avail && m.avail < 380 * 1048576)) { setTimeout(function () { if (prefs.restVideo || prefs.restVideoRotate) toast('عُرضت صورة بدل الفيديو لتوفير الذاكرة'); }, 1500); return false; }
  return true;
})();
function setVideo(want){
  var v = $('vid'), x = want && !LITE && _vidSafe ? pickVideo() : null, url = x && x.url;
  var on = !!url;
  document.body.classList.toggle('hasVid', on);
  ['vp-c', 'vp-tl', 'vp-bc', 'vl-thin', 'vl-capsule', 'vl-lux', 'vl-none', 'vl-bold'].forEach(function (c) { document.body.classList.remove(c); });
  $('vshade').style.display = on ? '' : 'none';
  if (!on) { if (v.getAttribute('src')) { v.pause(); v.removeAttribute('src'); v.load(); } v.style.display = 'none'; return false; }
  if (style !== 'lux' && style !== 'nap') { document.body.classList.add('vp-' + (prefs.restClockPos || 'c')); document.body.classList.add('vl-' + (prefs.restClockLook || 'thin')); }
  $('vshade').style.opacity = String(Math.min(60, Math.max(0, +prefs.restShadeV || 0)) / 100);
  if (v.getAttribute('src') !== url) v.src = url;
  v.style.display = '';
  videoState();
  return true;
}
/* أثناء الحركة يتوقف الفيديو، وليلاً يخفت أو يتوقف حسب الإعداد */
function videoState(){
  var v = $('vid'); if (!v.getAttribute('src')) return;
  var night = isNight(), nm = prefs.restNightVideo || 'dim';
  var stop = (prefs.restPauseMove !== false && isDriving()) || (night && nm === 'still') || document.hidden;
  v.style.opacity = night && nm === 'dim' ? '.45' : '1';
  if (stop) v.pause(); else { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
}
setInterval(videoState, 3000);
/* الضغط المطوّل على الخلفية: لوحة صغيرة لتغيير الفيديو والمكان والتعتيم */
var _vqT = null;
document.addEventListener('pointerdown', function (e) { if (!document.body.classList.contains('hasVid') || e.target.closest('button,a,#vq')) return; clearTimeout(_vqT); _vqT = setTimeout(openVq, 700); }, true);
['pointerup', 'pointercancel', 'pointermove'].forEach(function (ev) { document.addEventListener(ev, function (e) { if (ev !== 'pointermove' || Math.abs(e.movementX || 0) + Math.abs(e.movementY || 0) > 6) clearTimeout(_vqT); }, true); });
function saveRestPref(k, v){ prefs = loadPrefs(); prefs[k] = v; savePrefs(prefs); }
function openVq(){
  var q = $('vq'); if (q) q.remove();
  q = document.createElement('div'); q.id = 'vq';
  function b(t, on, fn){ var x = document.createElement('button'); x.textContent = t; if (on) x.className = 'on'; x.onclick = function (e) { e.stopPropagation(); fn(); openVq(); }; q.appendChild(x); }
  var list = videoList();
  if (list.length > 1) b('فيديو آخر', false, function () { var cur = pickVideo(), i = list.indexOf(list.filter(function (x) { return cur && x.name === cur.name; })[0]); var nx = list[(i + 1) % list.length]; _vidPick = null; saveRestPref(isNight() && prefs.restVideoNight ? 'restVideoNight' : 'restVideo', nx.name); applyStyle(); });
  [['c', 'الوسط'], ['tl', 'الزاوية'], ['bc', 'الأسفل']].forEach(function (p) { b(p[1], (prefs.restClockPos || 'c') === p[0], function () { saveRestPref('restClockPos', p[0]); applyStyle(); }); });
  b('تعتيم −', false, function () { saveRestPref('restShadeV', Math.max(0, (+prefs.restShadeV || 0) - 10)); applyStyle(); });
  b('تعتيم +', false, function () { saveRestPref('restShadeV', Math.min(60, (+prefs.restShadeV || 0) + 10)); applyStyle(); });
  var cl = document.createElement('button'); cl.textContent = '✕'; cl.onclick = function (e) { e.stopPropagation(); q.remove(); }; q.appendChild(cl);
  document.getElementById('stage').appendChild(q);
  clearTimeout(q._t); q._t = setTimeout(function () { if (q.parentNode) q.remove(); }, 8000);
}
document.addEventListener('visibilitychange', function () { var v = $('vid'); if (!v.getAttribute('src')) return; if (document.hidden) v.pause(); else { var p = v.play(); if (p && p.catch) p.catch(function () {}); } });
window.addEventListener('pagehide', function () { var v = $('vid'); try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {} });
function renderStrip(d){
  if (style !== 'lux') return;
  var list = prayerMinutes(d), np = nextPrayer(d), h = '';
  list.forEach(function (p) { h += '<div' + (p.key === np.key ? ' class="on"' : '') + '><b>' + p.name + '</b><span>' + fmtMin(p.min) + '</span></div>'; });
  if ($('strip').innerHTML !== h) $('strip').innerHTML = h;
}

/* ===== الدعاء: سطر واحد ===== */
var duas = duaList(), duaIndex = 0;
function setDua(){
  var el = $('dua'); if (el.classList.contains('hidden') || !duas.length) return;
  el.style.opacity = 0;
  setTimeout(function () {
    el.innerHTML = ''; el.textContent = duas[duaIndex % duas.length];
    var max = style === 'pattern' ? 46 : style === 'gallery' ? 30 : 40;
    fitOneLine(el, max, 24);
    if (perfOn()) { var mq = el.querySelector('.mq'); if (mq) mq.style.animation = 'none'; }
    el.style.opacity = 1;
  }, 300);
}
setInterval(function () { duaIndex++; setDua(); }, (+prefs.duaSec || 15) * 1000);

/* ===== المعرض ===== */
var gTimer = null, gIdx = 0;
function galleryList(){
  var imgs = userImages().filter(function (im) { return im.slot === 'home' || im.slot === 'rest'; }).map(function (im) { return im.url; });
  if (!imgs.length) imgs = Object.keys(THEMES).map(function (k) { return THEMES[k].bg; });
  return imgs;
}
function startGallery(){
  if (gTimer) return;
  // صورتان فقط في الذاكرة (الحالية والتالية) بدل تحميل كل الصور
  var g = $('gallery'), list = galleryList();
  g.innerHTML = '';
  var a = document.createElement('img'), b = document.createElement('img');
  a.alt = b.alt = ''; a.src = list[0]; a.style.opacity = 1; b.style.opacity = 0;
  if (list.length > 1) b.src = list[1];
  g.appendChild(a); g.appendChild(b);
  var front = a, back = b;
  gTimer = setInterval(function () {
    if (list.length < 2) return;
    gIdx++;
    back.style.opacity = 1; front.style.opacity = 0;
    var t = front; front = back; back = t;
    setTimeout(function () { back.src = list[(gIdx + 1) % list.length]; }, 1600);
  }, 12000);
}
function stopGallery(){ if (gTimer) { clearInterval(gTimer); gTimer = null; } }

/* ===== القيلولة ===== */
var napEnd = 0, alarmCtx = null, alarmTimer = null;
function renderNap(){
  var o = $('napOpts'); o.innerHTML = '';
  if (napEnd) {
    var stop = document.createElement('button'); stop.textContent = alarmTimer ? 'إيقاف المنبّه' : 'إلغاء القيلولة'; stop.className = 'on';
    stop.onclick = function () { napEnd = 0; stopAlarm(); renderNap(); tick(); };
    o.appendChild(stop); return;
  }
  [10, 15, 20, 30].forEach(function (m) {
    var b = document.createElement('button'); b.textContent = m + ' دقيقة';
    b.onclick = function () {
      try { alarmCtx = alarmCtx || new (window.AudioContext || window.webkitAudioContext)(); alarmCtx.resume(); } catch (e) {}
      napEnd = Date.now() + m * 60000; renderNap(); tick();
      var np = nextPrayer(new Date());
      $('napMsg').textContent = np.diff <= m ? 'تنبيه: صلاة ' + np.name + ' تدخل خلال القيلولة (' + np.timeFmt + ')' : 'نوماً هنيئاً. المنبّه بعد ' + m + ' دقيقة.';
    };
    o.appendChild(b);
  });
  $('napMsg').textContent = 'اختر مدة القيلولة';
}
function beep(){
  if (!alarmCtx) return;
  [0, 0.35, 0.7].forEach(function (t) {
    var o = alarmCtx.createOscillator(), g = alarmCtx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(alarmCtx.destination);
    var s = alarmCtx.currentTime + t;
    g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.4, s + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.25);
    o.start(s); o.stop(s + 0.3);
  });
}
function startAlarm(){ if (alarmTimer) return; beep(); alarmTimer = setInterval(beep, 1500); renderNap(); $('napMsg').textContent = 'انتهت القيلولة'; }
function stopAlarm(){ if (alarmTimer) { clearInterval(alarmTimer); alarmTimer = null; } }

function pad(x){ return (x < 10 ? '0' : '') + x; }
function tick(){
  var d = new Date();
  if (style === 'nap' && napEnd) {
    var left = Math.max(0, Math.round((napEnd - Date.now()) / 1000));
    $('clock').textContent = pad(Math.floor(left / 60)) + ':' + pad(left % 60);
    if (left === 0) startAlarm();
  } else $('clock').textContent = clockStr(d);
  $('greg').textContent = fmt({ day: 'numeric', month: 'long', year: 'numeric' }, 'ar-u-nu-latn', d) + ' م';
  $('hijri').textContent = fmt({ weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }, 'ar-SA-u-ca-islamic-umalqura-nu-latn', d);
  var np = nextPrayer(d);
  $('nextName').textContent = np.name; $('nextTime').textContent = np.timeFmt; $('nextDiff').textContent = fmtDiff(np.diff);
  var rems = activeReminders().map(function (r) { return r.text; });
  if (prefs.reminders) rems = rems.concat(hijriReminders());
  $('remind').textContent = rems.slice(0, 3).join(' · ');
  renderStrip(d);
  if (document.body.classList.contains('vl-lux')) $('luxClk').innerHTML = luxDialSvg(d, prefs.clockDial, 'height:100%');
  if (d.getSeconds() === 0) applyDim();
}
var w = todayWird(); $('wirdText').textContent = w[0]; $('wirdSrc').textContent = '(' + w[1] + ')';

$('styleBtn').onclick = function () {
  var i = STYLES.map(function (s) { return s[0]; }).indexOf(style);
  style = STYLES[(i + 1) % STYLES.length][0];
  prefs = loadPrefs(); prefs.restStyle = style; savePrefs(prefs);
  stopAlarm(); napEnd = 0; applyStyle(); tick();
};

/* الاستراحة صفحة مستقلة: نسجّل أنها مفتوحة، والخروج منها بيدك (أو بالمدة) يلغي «الرجوع لها» */
function restLeave(){ lsSet('carlauncher.restWanted', 0); nat('setRestOpen', false); nat('logEvent', 'خروج من الاستراحة'); }
if (!IN_FRAME) {
  lsSet('carlauncher.restWanted', Date.now()); nat('setRestOpen', true); nat('setOverlay', true);
  setTimeout(function () { nat('ready'); }, 300);
  setInterval(function () { lsSet('carlauncher.restWanted', Date.now()); }, 60000);
  document.addEventListener('click', function (e) { var a = e.target.closest && e.target.closest('a[href]'); if (a) restLeave(); }, true);
}
/* العودة للرئيسية تلقائياً بعد مدة (إن اخترتها)، ما عدا أثناء القيلولة */
var openedAt = Date.now();
document.addEventListener('pointerdown', function () { openedAt = Date.now(); }, true);
setInterval(function () {
  var r = +prefs.restReturn || 0;
  if (r && !napEnd && Date.now() - openedAt > r * 60000) { restLeave(); goHome(); }
}, 10000);
/* التنبيهات (التذكير والصلاة والمباريات) تظهر في الاستراحة أيضاً */
setInterval(function () { if (!document.hidden) { nativeAlerts(); remAlerts(); } }, 3000);

applyStyle(); tick();
setInterval(tick, 1000);
/* الشاشة تبقى تعمل في الاستراحة، وتحرير الذاكرة اختياري عند الدخول */
nat('keepOn', true);
window.addEventListener('pagehide', function () { nat('keepOn', false); });
fitStage();
</script>
</body>
