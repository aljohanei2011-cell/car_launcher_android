<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>الصيانة</title>
<link rel="stylesheet" href="common.css">
<style>
.page{height:100%;box-sizing:border-box;padding:22px 28px;display:flex;flex-direction:column;gap:14px;background:#0a0f1f}
.top{display:flex;align-items:center;gap:12px;height:52px}
.odo{display:flex;align-items:center;gap:14px;border-radius:20px;background:#111a33;border:1px solid #222c4d;padding:14px 20px;font-size:19px}
.inp{height:50px;border-radius:14px;border:1px solid #2b3658;background:#0b1328;color:#fff;font:inherit;font-size:19px;padding:0 14px;box-sizing:border-box}
.btn{height:50px;border-radius:14px;background:#1F5FD1;border:1px solid #6FA8FF;font-size:18px;padding:0 20px}
.btn.g{background:#1b2748;border-color:#2b3658}
.list{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.it{border-radius:20px;background:#111a33;border:1px solid #222c4d;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.it.due{border-color:#E8C061;background:#231d0e}
.h{display:flex;justify-content:space-between;align-items:center;font-size:21px;font-weight:700}
.st{font-size:16px;color:#9FB0CC}
.it.due .st{color:#FFE6A8}
.f{display:flex;gap:8px;align-items:center;font-size:15px;color:#9FB0CC;flex-wrap:wrap}
.f .inp{height:44px;font-size:16px;width:150px}
</style>
</head>
<body>
<div id="stage">
  <div class="page">
    <div class="top">
      <a class="icon-btn" href="index.html" aria-label="العودة للرئيسية" style="width:48px;height:48px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></a>
      <span style="font-size:26px;font-weight:700">الصيانة والتجديدات</span>
      <a class="btn g" href="fuel.html" style="margin-right:auto;display:flex;align-items:center">سجل الوقود</a>
    </div>
    <div class="odo">
      <span>عداد السيارة الآن:</span>
      <b id="odoNow" style="font-size:26px;direction:ltr">—</b>
      <span class="sub" style="margin-right:auto">ضبط من عداد التابلوه:</span>
      <input class="inp" id="odoIn" type="number" inputmode="numeric" placeholder="مثال 85230" style="width:180px">
      <button class="btn" id="odoSet">حفظ</button>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>
<script src="common.js"></script>
<script>
var prefs = loadPrefs(); applyPrefs('home', prefs);
document.body.style.background = '#0a0f1f';
var items = loadMaint();
function today(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

function render(){
  var odo = carOdometer();
  document.getElementById('odoNow').textContent = odo === null ? 'غير مضبوط' : odo.toLocaleString('en') + ' كم';
  var L = document.getElementById('list'); L.innerHTML = '';
  items.forEach(function (it, i) {
    var s = maintStatus(it);
    var box = document.createElement('div'); box.className = 'it' + (s.due ? ' due' : '');
    var parts = [];
    if (s.kmLeft !== null) parts.push(s.kmLeft >= 0 ? 'باقي ' + s.kmLeft.toLocaleString('en') + ' كم' : 'متأخر ' + (-s.kmLeft).toLocaleString('en') + ' كم');
    if (s.daysLeft !== null) parts.push(s.daysLeft >= 0 ? 'باقي ' + s.daysLeft + ' يوم (' + s.dueDate + ')' : 'انتهى منذ ' + (-s.daysLeft) + ' يوم');
    if (!parts.length) parts.push(it.km && odo === null ? 'اضبط عداد السيارة أولاً' : 'أدخل آخر موعد أو تاريخ الاستحقاق');
    box.innerHTML =
      '<div class="h"><span></span><button class="btn g" style="height:42px;font-size:16px">تم اليوم</button></div>' +
      '<div class="st"></div>' +
      '<div class="f">' +
        (it.km ? '<span>آخر مرة عند</span><input class="inp" data-k="lastKm" type="number" placeholder="كم"><span>كل ' + it.km.toLocaleString('en') + ' كم</span>' : '') +
        (it.months ? '<span>آخر تاريخ</span><input class="inp" data-k="lastDate" type="date">' : '') +
        (!it.km && !it.months ? '<span>تاريخ الانتهاء</span><input class="inp" data-k="dueDate" type="date">' : '') +
        (it.months && !it.km ? '' : '') +
      '</div>';
    box.querySelector('.h span').textContent = it.name;
    box.querySelector('.st').textContent = parts.join(' · ');
    box.querySelectorAll('input').forEach(function (inp) {
      var k = inp.getAttribute('data-k');
      inp.value = it[k] === null || it[k] === undefined ? '' : it[k];
      inp.onchange = function () { it[k] = inp.value === '' ? (k === 'lastKm' ? null : '') : (k === 'lastKm' ? +inp.value : inp.value); saveMaint(items); render(); };
    });
    box.querySelector('button').onclick = function () {
      if (it.km) it.lastKm = odo;
      if (it.months) it.lastDate = today();
      if (!it.km && !it.months) { var d = new Date(); d.setFullYear(d.getFullYear() + 1); it.dueDate = d.toISOString().slice(0, 10); }
      saveMaint(items); render();
    };
    L.appendChild(box);
  });
}
document.getElementById('odoSet').onclick = function () {
  var v = +document.getElementById('odoIn').value;
  if (!v) return;
  var t = natJSON('trip');
  prefs.odoOffset = v - (t ? t.odo : 0);
  savePrefs(prefs);
  document.getElementById('odoIn').value = '';
  render();
};
render();
fitStage();
</script>
</body>
</html>
