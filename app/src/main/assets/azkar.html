<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>الأذكار</title>
<link rel="stylesheet" href="common.css">
<style>
.top{display:flex;align-items:center;gap:16px;height:60px;padding:26px 40px 0}
.title{font-size:28px;font-weight:600}
.chips{display:flex;gap:12px;margin-right:auto}
.chip{height:50px;padding:0 22px;border-radius:25px;font-size:18px;border:1px solid #2b4a80;background:#13254a}
.chip.on{background:#1F5FD1;border-color:#6FA8FF;font-weight:700}
.body{flex:1;display:flex;flex-direction:column;gap:18px;padding:22px 40px 34px;box-sizing:border-box;min-height:0}
.card{flex:1;display:flex;flex-direction:column;padding:28px 36px;box-sizing:border-box}
.text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Alyamama','Thmanyah',serif;font-size:40px;line-height:1.8}
.nav{display:flex;align-items:center;justify-content:space-between}
.nbtn{width:64px;height:64px;border-radius:18px;background:#183262;border:1.5px solid #2b4a80;font-size:30px}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" alt="">
  <script>(function(){var b=document.getElementById('bg'),s=null,c='';try{s=localStorage.getItem('carlauncher.bg.home');c=localStorage.getItem('carlauncher.bodycls')||'';}catch(e){}if(s)b.src=s;if(c)document.body.className+=' '+c;})();</script>
  <div class="shade"></div>
  <div class="wrap">
    <div class="top">
      <a class="icon-btn" href="index.html" aria-label="العودة للرئيسية"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></a>
      <h1 class="title" style="margin:0">الأذكار</h1>
      <div class="chips" id="chips"></div>
    </div>
    <div class="body">
      <div class="glass card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="accent" id="groupName" style="font-size:24px"></span>
          <span class="sub" id="pos" style="font-size:20px;direction:ltr"></span>
        </div>
        <div class="text" id="text"></div>
        <div class="sub" id="repeat" style="text-align:center;font-size:20px"></div>
      </div>
      <div class="nav">
        <button class="nbtn" id="prev" aria-label="الذكر السابق">›</button>
        <span class="sub" style="font-size:18px">اسحب أو اضغط للتنقل بين الأذكار</span>
        <button class="nbtn" id="next" aria-label="الذكر التالي">‹</button>
      </div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
var GROUPS = [
  { key: 'morning', name: 'ذكر الصباح', items: [
    ['أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له', 'مرة واحدة'],
    ['اللهم بك أصبحنا، وبك أمسينا، وبك نحيا، وبك نموت، وإليك النشور', 'مرة واحدة'],
    ['سبحان الله وبحمده', '100 مرة'] ] },
  { key: 'evening', name: 'ذكر المساء', items: [
    ['أمسينا وأمسى الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له', 'مرة واحدة'],
    ['اللهم بك أمسينا، وبك أصبحنا، وبك نحيا، وبك نموت، وإليك المصير', 'مرة واحدة'] ] },
  { key: 'travel', name: 'دعاء السفر', items: [
    ['سبحان الذي سخّر لنا هذا وما كنا له مقرنين، وإنا إلى ربنا لمنقلبون', 'عند ركوب السيارة'],
    ['اللهم إنا نسألك في سفرنا هذا البر والتقوى، ومن العمل ما ترضى', 'في بداية السفر'],
    ['اللهم هوّن علينا سفرنا هذا واطوِ عنا بُعده، اللهم أنت الصاحب في السفر، والخليفة في الأهل', 'في بداية السفر'],
    ['آيبون تائبون عابدون لربنا حامدون', 'عند الرجوع من السفر'] ] }
];
var prefs = loadPrefs();
applyPrefs('home', prefs);
var gi = 0, ii = 0;
var gq = (location.search.match(/g=(\w+)/) || [])[1];
GROUPS.forEach(function (g, k) { if (g.key === gq) gi = k; });
if (!gq) { var h = new Date().getHours(); gi = (h >= 15 || h < 3) ? 1 : 0; }
/* تسجيل قراءة أذكار اليوم (لإخفاء تنبيهها من الرئيسية) */
(function () { var r = lsGet('carlauncher.azkarRead', {}); r[GROUPS[gi].key] = todayStr(); lsSet('carlauncher.azkarRead', r); })();

function render(){
  var g = GROUPS[gi], it = g.items[ii];
  document.getElementById('groupName').textContent = g.name;
  document.getElementById('pos').textContent = (ii + 1) + ' / ' + g.items.length;
  document.getElementById('text').textContent = it[0];
  document.getElementById('repeat').textContent = it[1];
  var chips = document.getElementById('chips');
  chips.innerHTML = '';
  GROUPS.forEach(function (x, k) {
    var b = document.createElement('button');
    b.className = 'chip' + (k === gi ? ' on' : '');
    b.textContent = x.name;
    b.onclick = function () { gi = k; ii = 0; render(); };
    chips.appendChild(b);
  });
}
document.getElementById('next').onclick = function () { var n = GROUPS[gi].items.length; ii = (ii + 1) % n; render(); };
document.getElementById('prev').onclick = function () { var n = GROUPS[gi].items.length; ii = (ii - 1 + n) % n; render(); };
render();
fitStage();
</script>
</body>
</html>
