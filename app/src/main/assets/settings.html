<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>الإعدادات</title>
<link rel="stylesheet" href="common.css">
<style>
/* ===== الهيكل: قائمة جانبية + محتوى ===== */
.wrap{flex-direction:row!important;gap:16px;padding:16px;box-sizing:border-box}
.side{width:244px;flex:none;padding:14px 10px;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;overflow-y:auto;scrollbar-width:none;border-radius:24px}
.side::-webkit-scrollbar{display:none}
.side h1{font-size:23px;margin:2px 10px 10px;display:flex;align-items:center;gap:10px;font-weight:700}
.side h1 svg{width:26px;height:26px}
.nav{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 12px;border-radius:15px;font:inherit;font-size:17.5px;color:inherit;background:none;border:none;text-align:right;opacity:.86}
.nav i{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(127,127,127,.14);flex:none}
.nav i svg{width:19px;height:19px}
.nav.on{background:var(--accent,#2F7BFF);color:#fff;font-weight:700;opacity:1;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.nav.on i{background:rgba(0,0,0,.18)}
body.skin-gold .nav.on{background:linear-gradient(165deg,#b98a35,#7a5a1f)}
body.skin-saudi .nav.on{background:linear-gradient(165deg,#1F8A4C,#0e5a32)}
body.skin-ptime .nav.on{color:#10151f}
.mainc{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px;height:56px;flex:none}
.top .icon-btn{width:56px;height:56px;flex:none}
.sbox{flex:1;min-width:0;height:56px;border-radius:18px;display:flex;align-items:center;gap:10px;padding:0 16px;font:inherit;font-size:18px;color:inherit;opacity:.9;text-align:right}
.sbox svg{width:22px;height:22px;flex:none}
.qk{height:56px;padding:0 12px 0 14px;border-radius:18px;display:flex;align-items:center;gap:10px;font:inherit;font-size:16px;color:inherit;white-space:nowrap;flex:none}
.qk b{width:42px;height:24px;border-radius:12px;background:#2a3a58;position:relative;display:inline-block;flex:none}
.qk b::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:9px;background:#fff;transition:left .15s}
.qk.on b{background:var(--accent,#2F7BFF)}.qk.on b::after{left:21px}
.body{flex:1;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:16px}
.body::-webkit-scrollbar{display:none}
/* ===== البطاقات والصفوف ===== */
.section{padding:16px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:11px;border-radius:24px}
.label{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--accent,#7FB8FF)}
.label svg{width:22px;height:22px;flex:none}
body.skin-ptime .label{color:var(--accent)}
.opts{display:flex;gap:9px;flex-wrap:wrap}
.opt{min-height:52px;padding:0 18px;border-radius:15px;background:#13254a;border:1px solid #23406f;font-size:17.5px;color:#fff}
.opt.on{background:#1F5FD1;border:1.5px solid #6FA8FF;font-weight:700}
.opt.sm{min-height:46px;font-size:16px;padding:0 15px}
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{height:84px;border-radius:16px;background-size:cover;background-position:center;border:3px solid transparent;position:relative;font-size:16px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center;padding:8px}
.tile.on{border-color:var(--accent,#2F7BFF);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.tile .x{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:15px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.4);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.tile.add{border:2px dashed #4b6ea8;background:rgba(19,37,74,.7);align-items:center;font-size:17px;text-shadow:none}
.toggle{display:flex;justify-content:space-between;align-items:center;font-size:19px;gap:16px;min-height:52px;border-top:1px solid rgba(127,127,127,.18);padding-top:8px}
.label + .toggle,.label + .note + .toggle{border-top:none;padding-top:0}
.sw{width:64px;height:36px;border-radius:18px;background:#2a3a58;border:none;position:relative;flex:none}
.sw.on{background:var(--accent,#2F7BFF)}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:14px;background:#fff;transition:left .15s}
.sw.on::after{left:32px}
.note{font-size:15px;color:#9FB0CC;line-height:1.5}
.txt{height:54px;width:360px;max-width:100%;border-radius:16px;border:1px solid #23406f;background:#0e1c38;color:#fff;font:inherit;font-size:20px;padding:0 16px;box-sizing:border-box}
.line{display:flex;align-items:center;gap:14px;font-size:18px;flex-wrap:wrap}
.line .v{color:#9FD0FF}
.prev i{display:block;background:#2b4a80;border-radius:4px;flex:1}
.prev b{display:block;background:#4b6ea8;border-radius:3px;flex:1;height:100%}
.opt:disabled{opacity:.35}
.adv{display:none}.showAdv .adv{display:flex}
.advBtn{align-self:stretch;min-height:54px;border-radius:18px;border:1px dashed rgba(127,127,127,.45);background:none;color:inherit;font:inherit;font-size:17px;opacity:.85}
/* ===== نظرة عامة ===== */
.ov4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ovc{padding:14px 16px;border-radius:20px}.ovc span{font-size:14px;opacity:.75}.ovc b{display:block;font-size:24px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.shc a,.shc button{height:112px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:inherit;font-size:18px;font-weight:600;color:inherit;border:1px solid rgba(127,127,127,.25);background:rgba(127,127,127,.08)}
.shc svg{width:34px;height:34px}
.att{display:flex;align-items:center;gap:14px;min-height:60px;border-top:1px solid rgba(127,127,127,.18);padding-top:8px}
.att:first-of-type{border-top:none}
.att .ai{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(242,200,121,.15);flex:none}.att .ai svg{width:22px;height:22px}
.att .tx{flex:1}.att .tx b{display:block;font-size:18.5px}.att .tx span{font-size:14.5px;opacity:.75}
.tag{font-size:12.5px;padding:3px 9px;border-radius:9px;margin-right:8px;vertical-align:2px;font-weight:600}
.t1{background:rgba(242,200,121,.16);color:#F2C879}.t2{background:rgba(255,107,90,.15);color:#FF9A8A}.t3{background:rgba(90,209,160,.15);color:#6FE3B4}
/* ===== البحث ===== */
.srch{height:56px;width:100%;border-radius:18px;border:1.5px solid #2b4a80;background:#0e1c38;color:#fff;font:inherit;font-size:21px;padding:0 18px;box-sizing:border-box}
.sres{display:flex;flex-direction:column;gap:8px}
.sres button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:right;padding:12px 18px;border-radius:16px;border:1px solid #23406f;background:rgba(19,37,74,.85);color:#fff;font:inherit}
.sres b{font-size:19px}.sres span{font-size:15px;color:#9FB0CC}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent,#2F7BFF)}100%{box-shadow:0 0 0 0 transparent}}
body.skin-light .opt,body.skin-light .sres button{color:#fff}
body.skin-light .note{color:#4A5A70!important}
body.perf .nav.on,body.perf .section{box-shadow:none!important}
</style>
</head>
<body data-nodrive="1">
<div id="stage">
  <img id="bg" alt="">

</div>

<script>
var prefs = loadPrefs();

  check: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  update: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>'
};
function svgI(k, col){ return '<svg viewBox="0 0 24 24" fill="none" stroke="' + (col || 'currentColor') + '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + (SI[k] || SI.overview) + '</svg>'; }
var TABS = [['overview', 'نظرة عامة'], ['look', 'المظهر'], ['home', 'الواجهة والبطاقات'], ['clock', 'الساعة والخطوط'], ['restT', 'الاستراحة'], ['prayer', 'الصلاة'], ['alerts', 'التنبيهات والمباريات'],
  ['drive', 'القيادة'], ['comm', 'الاتصال والصوت'], ['car', 'السيارة'], ['worship', 'العبادة'], ['system', 'النظام والأدوات']];
/* دوال الرسم لكل قسم (بالترتيب) */
var CAT_FN = { look: ['renderLook'], home: ['renderHome'], clock: ['renderHome', 'renderLook'], restT: ['renderRest', 'renderLook'], prayer: ['renderPrayer'], alerts: ['renderAlerts'],
  drive: ['renderPrayer', 'renderSystem'], comm: ['renderVoice', 'renderPrayer', 'renderApps'], car: ['renderApps'], worship: ['renderPrayer'], system: ['renderSystem'] };
/* عنوان البطاقة ← القسم. «*» تعني خيارات متقدمة (مطوية) */
var SEC_CAT = {
  'الثيم': 'look', 'اسم السيارة أعلى الشاشة': 'look', 'خلفية الرئيسية': 'look', 'الوضع الليلي': 'look', 'وضوح البطاقات': 'look',
  'تصميم الواجهة': 'home', 'الصفحات والبطاقات': 'home', 'حجم النصوص وتحرير البطاقات': 'home', 'القائمة السفلية': 'home', 'التخطيطات المحفوظة': 'home*', 'الشريط العلوي (الأيقونات)': 'home',
  'شكل الساعة': 'clock', 'الوقت والأرقام': 'clock', 'الخطوط': 'clock',
  'نمط شاشة الاستراحة': 'restT', 'ما يظهر': 'restT', 'متى تعمل': 'restT', 'مدة بقائها': 'restT', 'خلفية الاستراحة': 'restT', 'الأدعية': 'restT*',
  'المدينة (لمواقيت الصلاة)': 'prayer', 'تنبيه الصلاة': 'prayer', 'الصوت': 'prayer', 'تذكيرات': 'prayer',
  'مساعد القيادة': 'drive', 'تنبيه السرعة': 'drive', 'تنبيه الاستراحة': 'drive', 'القيادة والإنترنت': 'drive', 'الإضاءة الليلية': 'drive', 'عند تشغيل السيارة': 'drive', 'رسالة الوصول': 'drive*',
  'الأوامر الصوتية': 'comm', 'المكالمات والرسائل': 'comm', 'التطبيقات': 'comm', 'التحكم بالموسيقى من الرئيسية': 'comm', 'وضع الركاب': 'comm*',
  'شكل التنبيهات ومكانها': 'alerts', 'مكان كل نوع': 'alerts*', 'الظهور فوق الخرائط': 'alerts', 'المباريات': 'alerts', 'سجل الأحداث': 'system*',
  'السيارة': 'car', 'تكلفة الوقود': 'car',
  'العبادة': 'worship', 'دعاء السفر': 'worship',
  'أدوات الشاشة': 'system', 'النسخ الاحتياطية التلقائية': 'system*', 'التحديث والنسخ الاحتياطي': 'system', 'الواجهة الافتراضية': 'system', 'الأداء': 'system', 'الرقم السري': 'system', 'حول التطبيق': 'system',

};
var LITE_HIDE = { 'الثيم': 1, 'الأوامر الصوتية': 1, 'المكالمات والرسائل': 1, 'مساعد القيادة': 1 };
var tab = 'overview', citySearch = '', pageIdx = 0;
try { tab = sessionStorage.getItem('settings.tab') || 'overview'; } catch (e) {}
if (tab === 'apps') tab = 'comm';
if (!TABS.some(function (x) { return x[0] === tab; })) tab = 'overview';

function upd(){ savePrefs(prefs); applyPrefs('home', prefs); render(); }
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function section(title, note){
  var s = el('div', 'glass section');
  if (title) { var lb = el('span', 'label'); lb.innerHTML = svgI(window._cat || tab); lb.appendChild(document.createTextNode(title)); s.appendChild(lb); }

  var c = SEC_CAT[title] || '', want = window._cat;

  if (LITE && LITE_HIDE[title]) return s;

  if (want && c.replace('*', '') !== want) return s;
  if (c.indexOf('*') > 0) { s.classList.add('adv'); window._advN = (window._advN || 0) + 1; }

}
function opts(parent, list, cur, onPick, small){
  var o = el('div', 'opts');
  list.forEach(function (x) {
    var b = el('button', 'opt' + (small ? ' sm' : '') + (String(cur) === String(x[0]) ? ' on' : ''), x[1]);
    b.onclick = function () { onPick(x[0]); };

}
function toggle(parent, label, key, note){

function bgTiles(parent, slot, cur, onPick, withAuto){
  var g = el('div', 'themes');
  if (withAuto) {
    var a = el('button', 'tile add' + (cur === 'auto' ? ' on' : ''), 'تلقائي (حسب خلفية الرئيسية)');
    a.onclick = function () { onPick('auto'); }; g.appendChild(a);
  }
  // نعرض خلفيات الثيم الحالي فقط (أخف على الذاكرة)، والبقية بزر «كل الخلفيات»
  var grp = function (k) { var m = k.match(/^(gold|red|saudi|light|ptime)_/); return m ? m[1] : 'classic'; };
  var mine = prefs.skin || 'classic';
  var keys = Object.keys(THEMES).filter(function (k) { return window._allBgs || grp(k) === mine || k === cur; });
  keys.forEach(function (k) {
    var b = el('button', 'tile' + (cur === k ? ' on' : ''), THEMES[k].label);
    b.style.backgroundImage = "url('" + thumb(slot === 'rest' ? THEMES[k].rest : THEMES[k].bg) + "')";
    b.onclick = function () { onPick(k); };
    g.appendChild(b);
  });
  userImages().filter(function (im) { return im.slot === slot; }).forEach(function (im) {
    var key = 'user:' + im.name;
    var b = el('button', 'tile' + (cur === key ? ' on' : ''), 'صورتي');
    b.style.backgroundImage = "url('" + im.url + "')";
    b.onclick = function () { onPick(key); };
    var x = el('span', 'x', '×'); x.setAttribute('aria-label', 'حذف الصورة');
    x.onclick = function (e) {
      e.stopPropagation();
      nat('deleteImage', im.name); _imgs = null;

    var b = el('button', 'opt sm on', x[4]); b.onclick = x[5]; r.appendChild(b); at.appendChild(r);
  });
}
