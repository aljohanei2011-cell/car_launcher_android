<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>الإعدادات</title>
<link rel="stylesheet" href="common.css">
<style>
.top{display:flex;align-items:center;gap:16px;height:60px;padding:22px 40px 0}
.title{font-size:28px;font-weight:600;margin:0}
.tabs{display:flex;gap:10px;margin-right:auto}
.tab{height:50px;padding:0 15px;font-size:17px !important;border-radius:26px;border:1px solid #2b4a80;background:rgba(19,37,74,.85);font-size:19px}
.tab.on{background:#1F5FD1;border-color:#6FA8FF;font-weight:700}
.body{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px 40px 20px;box-sizing:border-box;min-height:0;overflow-y:auto}
.section{padding:14px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.label{font-size:20px;font-weight:600}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{height:54px;padding:0 20px;border-radius:16px;background:#13254a;border:1px solid #23406f;font-size:18px}
.opt.on{background:#1F5FD1;border:1.5px solid #6FA8FF;font-weight:700}
.opt.sm{height:46px;font-size:16px;padding:0 16px}
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{height:84px;border-radius:16px;background-size:cover;background-position:center;border:3px solid transparent;position:relative;font-size:16px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center;padding:8px}
.tile.on{border-color:#2F7BFF}
.tile .x{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:15px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.4);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.tile.add{border:2px dashed #4b6ea8;background:rgba(19,37,74,.7);align-items:center;font-size:17px;text-shadow:none}
.toggle{display:flex;justify-content:space-between;align-items:center;font-size:19px;gap:16px}
.sw{width:64px;height:36px;border-radius:18px;background:#2a3a58;border:none;position:relative;flex:none}
.sw.on{background:#2F7BFF}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:14px;background:#fff;transition:left .15s}
.sw.on::after{left:32px}
.note{font-size:15px;color:#9FB0CC}
.txt{height:54px;width:360px;border-radius:16px;border:1px solid #23406f;background:#0e1c38;color:#fff;font:inherit;font-size:20px;padding:0 16px;box-sizing:border-box}
.line{display:flex;align-items:center;gap:14px;font-size:18px}
.line .v{color:#9FD0FF}
.prev i{display:block;background:#2b4a80;border-radius:4px;flex:1}
.prev b{display:block;background:#4b6ea8;border-radius:3px;flex:1;height:100%}
.opt:disabled{opacity:.35}
</style>
</head>
<body data-nodrive="1">
<div id="stage">
  <img id="bg" src="bg/home_mountain.jpg" alt="">
  <div class="shade"></div>
  <div class="wrap">
    <div class="top">
      <a class="icon-btn" href="index.html" aria-label="العودة للرئيسية"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></a>
      <h1 class="title">الإعدادات</h1>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="body" id="body"></div>
    <input type="file" id="logoFile" accept="image/*" style="display:none">
  </div>
</div>

<script src="common.js"></script>
<script>
var prefs = loadPrefs();
applyPrefs('home', prefs);
var TABS = [['look', 'المظهر'], ['home', 'الواجهة'], ['restT', 'الاستراحة'], ['prayer', 'الصلاة والتنبيهات'], ['apps', 'التطبيقات'], ['system', 'النظام']];
var tab = 'look', citySearch = '', pageIdx = 0;
try { tab = sessionStorage.getItem('settings.tab') || 'look'; } catch (e) {}

function upd(){ savePrefs(prefs); applyPrefs('home', prefs); render(); }
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function section(title, note){
  var s = el('div', 'glass section');
  if (title) s.appendChild(el('span', 'label', title));
  if (note) s.appendChild(el('span', 'note', note));
  document.getElementById('body').appendChild(s);
  return s;
}
function opts(parent, list, cur, onPick, small){
  var o = el('div', 'opts');
  list.forEach(function (x) {
    var b = el('button', 'opt' + (small ? ' sm' : '') + (String(cur) === String(x[0]) ? ' on' : ''), x[1]);
    b.onclick = function () { onPick(x[0]); };
    o.appendChild(b);
  });
  parent.appendChild(o);
  return o;
}
function toggle(parent, label, key, note){
  var t = el('div', 'toggle');
  t.appendChild(el('span', '', label));
  var sw = el('button', 'sw' + (prefs[key] ? ' on' : ''));
  sw.setAttribute('role', 'switch'); sw.setAttribute('aria-label', label); sw.setAttribute('aria-checked', prefs[key] ? 'true' : 'false');
  sw.onclick = function () { prefs[key] = !prefs[key]; upd(); };
  t.appendChild(sw);
  parent.appendChild(t);
  if (note) parent.appendChild(el('span', 'note', note));
}
function bgTiles(parent, slot, cur, onPick, withAuto){
  var g = el('div', 'themes');
  if (withAuto) {
    var a = el('button', 'tile add' + (cur === 'auto' ? ' on' : ''), 'تلقائي (حسب خلفية الرئيسية)');
    a.onclick = function () { onPick('auto'); }; g.appendChild(a);
  }
  Object.keys(THEMES).forEach(function (k) {
    var b = el('button', 'tile' + (cur === k ? ' on' : ''), THEMES[k].label);
    b.style.backgroundImage = "url('" + (slot === 'rest' ? THEMES[k].rest : THEMES[k].bg) + "')";
    b.onclick = function () { onPick(k); };
    g.appendChild(b);
  });
  userImages().filter(function (im) { return im.slot === slot; }).forEach(function (im) {
    var key = 'user:' + im.name;
    var b = el('button', 'tile' + (cur === key ? ' on' : ''), 'صورتي');
    b.style.backgroundImage = "url('" + im.url + "')";
    b.onclick = function () { onPick(key); };
    var x = el('span', 'x', '×'); x.setAttribute('aria-label', 'حذف الصورة');
    x.onclick = function (e) {
      e.stopPropagation();
      nat('deleteImage', im.name); _imgs = null;
      if (prefs.theme === key) prefs.theme = 'mountain';
      if (prefs.restBg === key) prefs.restBg = 'auto';
      if (prefs.nightTheme === key) prefs.nightTheme = 'night';
      upd();
    };
    b.appendChild(x);
    g.appendChild(b);
  });
  var add = el('a', 'tile add', '+ من الجوال (باركود)'); add.href = 'upload.html';
  g.appendChild(add);
  parent.appendChild(g);
}
function appLabel(pkg){
  if (!pkg) return 'لم يُختر';
  var a = (natJSON('apps') || []).filter(function (x) { return x.pkg === pkg; })[0];
  return a ? a.label : pkg;
}

/* ===== تبويب المظهر ===== */
function renderLook(){
  var sk = section('الثيم', 'شكل البطاقات والألوان والزخارف. اختيار الثيم يضبط خلفيته المناسبة تلقائياً، ويمكنك تغيير الخلفية بعدها.');
  var sg = el('div', 'themes'); sg.style.gridTemplateColumns = 'repeat(3,minmax(0,1fr))';
  [['classic', 'bg/home_mountain.jpg'], ['gold', 'skins/gold/bg_night.jpg'], ['red', 'skins/red/bg_night.jpg']].forEach(function (x) {
    var b = el('button', 'tile' + ((prefs.skin || 'classic') === x[0] ? ' on' : ''), SKINS[x[0]].label);
    b.style.backgroundImage = "url('" + x[1] + "')"; b.style.height = '110px'; b.style.fontSize = '19px';
    b.onclick = function () { prefs.skin = x[0]; prefs.theme = SKINS[x[0]].theme; upd(); };
    sg.appendChild(b);
  });
  sk.appendChild(sg);
  var s0 = section('الوقت والأرقام');
  opts(s0, [[false, '12 ساعة (ص/م)'], [true, '24 ساعة']], prefs.h24, function (k) { prefs.h24 = k; upd(); });
  opts(s0, [['en', 'أرقام 0123'], ['ar', 'أرقام ٠١٢٣']], prefs.digits, function (k) { prefs.digits = k; savePrefs(prefs); location.reload(); });
  var s = section('اسم السيارة أعلى الشاشة');
  var brands = Object.keys(BRANDS).map(function (k) { return [k, BRANDS[k].label]; }).concat([['text', 'اسم مخصص'], ['image', 'صورة'], ['none', 'بدون']]);
  opts(s, brands, prefs.brand, function (k) {
    if (k === 'image' && !loadLogo()) { document.getElementById('logoFile').click(); return; }
    prefs.brand = k; upd();
  });
  if (prefs.brand === 'text') {
    var inp = el('input', 'txt'); inp.maxLength = 24; inp.placeholder = 'اكتب الاسم'; inp.value = prefs.brandText || '';
    inp.oninput = function () { prefs.brandText = inp.value; savePrefs(prefs); applyPrefs('home', prefs); };
    s.appendChild(inp);
  }
  if (prefs.brand === 'image') {
    var r = el('div', 'opts');
    var b1 = el('button', 'opt sm', 'من ذاكرة الشاشة'); b1.onclick = function () { document.getElementById('logoFile').click(); };
    var b2 = el('a', 'opt sm', 'من الجوال (باركود)'); b2.href = 'upload.html'; b2.style.display = 'flex'; b2.style.alignItems = 'center';
    r.appendChild(b1); r.appendChild(b2); s.appendChild(r);
  }
  if (prefs.brand !== 'none' && prefs.brand !== 'image') {
    s.appendChild(el('span', 'note', 'ماركات تظهر بجانب الاسم:'));
    var sb = el('div', 'opts');
    Object.keys(BRANDS).filter(function (k) { return k !== prefs.brand; }).forEach(function (k) {
      var on = (prefs.subBrands || []).indexOf(k) >= 0;
      var b = el('button', 'opt sm' + (on ? ' on' : ''), BRANDS[k].label);
      b.onclick = function () {
        var a = (prefs.subBrands || []).slice(), i = a.indexOf(k);
        if (i >= 0) a.splice(i, 1); else a.push(k);
        prefs.subBrands = a; upd();
      };
      sb.appendChild(b);
    });
    s.appendChild(sb);
  }
  s.appendChild(el('span', 'note', 'الحجم:'));
  opts(s, [['s', 'صغير'], ['m', 'متوسط'], ['l', 'كبير']], prefs.brandSize || 'm', function (k) { prefs.brandSize = k; upd(); }, true);

  s = section('خلفية الرئيسية');
  bgTiles(s, 'home', prefs.theme, function (k) { prefs.theme = k; upd(); });

  s = section('خلفية الاستراحة', 'يفضَّل صورة هادئة وداكنة ليُقرأ الدعاء بوضوح.');
  bgTiles(s, 'rest', prefs.restBg || 'auto', function (k) { prefs.restBg = k; upd(); }, true);

  s = section('');
  toggle(s, 'الوضع الليلي التلقائي (من المغرب إلى الشروق)', 'autoNight');
  if (prefs.autoNight) {
    s.appendChild(el('span', 'note', 'خلفية الليل:'));
    var nightOpts = Object.keys(THEMES).map(function (k) { return [k, THEMES[k].label]; })
      .concat(userImages().filter(function (im) { return im.slot === 'home'; }).map(function (im, i) { return ['user:' + im.name, 'صورتي ' + (i + 1)]; }));
    opts(s, nightOpts, prefs.nightTheme, function (k) { prefs.nightTheme = k; upd(); }, true);
  }

  s = section('الخطوط', 'كل زر مكتوب بخطه. الخطوط المضافة مسؤولية ترخيصها عليك.');
  function fontRow(title, key, def, sample){
    s.appendChild(el('span', 'note', title));
    var o = el('div', 'opts');
    var cur = prefs[key] || def;
    Object.keys(FONTS).forEach(function (k) {
      if (key === 'font' && k === 'amiri') return;
      var b = el('button', 'opt' + (cur === k ? ' on' : ''));
      var t1 = el('span', '', sample || FONTS[k].label); t1.style.fontFamily = FONTS[k].css; b.appendChild(t1);
      if (sample) { var t2 = el('span', '', ' · ' + FONTS[k].label); t2.style.cssText = 'font-size:14px;opacity:.7'; b.appendChild(t2); }
      b.onclick = function () { prefs[key] = k; upd(); };
      o.appendChild(b);
    });
    s.appendChild(o);
  }
  fontRow('خط الواجهة:', 'font', 'thmanyah');
  fontRow('خط الساعة والأرقام الكبيرة:', 'clockFont', prefs.font, '12:45');
  fontRow('خط الأدعية والأذكار:', 'duaFont', 'amiri', 'سبحان الله');

  s = section('');
  toggle(s, 'بطاقات مصمتة (بدون ضبابية)', 'solid', 'مفيد للأجهزة القديمة (Android 9) أو لتحسين الوضوح.');
}

/* ===== تبويب الصلاة والتنبيهات ===== */
function renderPrayer(){
  var s = section('المدينة (لمواقيت الصلاة)', 'طريقة أم القرى. «موقعي الحالي» يستخدم GPS ويتغير معك في السفر.');
  var q = el('input', 'txt'); q.placeholder = 'ابحث عن مدينة'; q.value = citySearch; s.appendChild(q);
  var holder = el('div'); s.appendChild(holder);
  function drawCities(){
    holder.innerHTML = '';
    var list = [['gps', 'موقعي الحالي']].concat(Object.keys(CITIES).map(function (k) { return [k, CITIES[k].label]; }))
      .filter(function (x) { return !citySearch || x[1].indexOf(citySearch) >= 0 || x[0] === prefs.city; });
    opts(holder, list, prefs.city, function (k) { prefs.city = k; citySearch = ''; upd(); pushPrayerSchedule(); }, true);
  }
  q.oninput = function () { citySearch = q.value.trim(); drawCities(); };
  drawCities();

  s = section('تنبيه الصلاة');
  toggle(s, 'تنبيه عند دخول وقت الصلاة', 'adhan');
  if (prefs.adhan) {
    s.appendChild(el('span', 'note', 'تنبيه مسبق قبل الصلاة:'));
    opts(s, [[0, 'بدون'], [5, '5 دقائق'], [10, '10 دقائق'], [15, '15 دقيقة'], [20, '20 دقيقة']], prefs.preMin, function (k) { prefs.preMin = k; upd(); }, true);
  }
  s = section('الصوت');
  toggle(s, 'صوت التنبيه', 'sound');
  toggle(s, 'خفض صوت الموسيقى مؤقتاً عند التنبيه', 'duck', 'يعمل حتى والخرائط أو الموسيقى مفتوحة.');
  var hs = nat('hasSound');
  toggle(s, 'استخدام صوتي المرفوع عند دخول الوقت (مثل الأذان)', 'customSound', hs ? 'يوجد صوت مرفوع ✓' : 'لا يوجد صوت مرفوع بعد. أرسله من الجوال (تبويب «صوت التنبيه»).');
  var r0 = el('div', 'opts');
  var up = el('a', 'opt sm', hs ? 'تغيير الصوت من الجوال' : 'إرسال صوت من الجوال'); up.href = 'upload.html'; up.style.display = 'flex'; up.style.alignItems = 'center'; r0.appendChild(up);
  if (hs) {
    var tb = el('button', 'opt sm', 'تجربة'); tb.onclick = function () { nat('testSound'); }; r0.appendChild(tb);
    var db = el('button', 'opt sm', 'حذف الصوت'); db.onclick = function () { nat('deleteSound'); render(); }; r0.appendChild(db);
  }
  s.appendChild(r0);

  s = section('تنبيه السرعة');
  toggle(s, 'تنبيه عند تجاوز سرعة محددة', 'speedOn', 'يعمل من GPS في الخلفية، مرة كل دقيقة كحد أقصى.');
  if (prefs.speedOn) opts(s, [[80, '80'], [100, '100'], [110, '110'], [120, '120'], [130, '130'], [140, '140']].map(function (x) { return [x[0], x[1] + ' كم/س']; }), prefs.speedLimit, function (k) { prefs.speedLimit = k; upd(); }, true);

  s = section('تذكيرات');
  toggle(s, 'تذكيرات اليوم من التقويم', 'reminders');
  if (prefs.reminders) {
    var SR = [['friday', 'الجمعة'], ['fasting', 'صيام الإثنين والخميس'], ['white', 'الأيام البيض'], ['ramadan', 'رمضان'], ['eid', 'العيدان'], ['dhulhijja', 'عشر ذي الحجة وعرفة']];
    var sr = Object.assign({}, DEFAULT_PREFS.sysRem, prefs.sysRem || {});
    var o2 = el('div', 'opts');
    SR.forEach(function (x) {
      var b = el('button', 'opt sm' + (sr[x[0]] ? ' on' : ''), x[1]);
      b.onclick = function () { sr[x[0]] = !sr[x[0]]; prefs.sysRem = sr; upd(); };
      o2.appendChild(b);
    });
    s.appendChild(o2);
    s.appendChild(el('span', 'note', 'مكان ظهورها في الرئيسية:'));
    opts(s, [['banner', 'الشريط العلوي'], ['clock', 'بجوار الساعة'], ['none', 'شاشة الاستراحة فقط']], prefs.remPlace, function (k) { prefs.remPlace = k; upd(); }, true);
  }
  var rl = el('div', 'line'); rl.appendChild(el('span', '', 'تذكيراتي الخاصة: تكتبها وتظهر بجوار الساعة في وقتها.'));
  var ra = el('a', 'opt sm', 'فتح التذكيرات'); ra.href = 'reminders.html'; ra.style.display = 'flex'; ra.style.alignItems = 'center'; ra.style.marginRight = 'auto'; rl.appendChild(ra);
  s.appendChild(rl);

  s = section('تنبيه الاستراحة');
  toggle(s, 'تنبيه بعد قيادة متواصلة', 'rest', 'يُصفَّر العداد إذا توقفت 15 دقيقة أو أكثر.');
  if (prefs.rest) opts(s, [[90, 'ساعة ونصف'], [120, 'ساعتان'], [150, 'ساعتان ونصف'], [180, '3 ساعات']], prefs.restMin, function (k) { prefs.restMin = k; upd(); }, true);

  s = section('دعاء السفر');
  toggle(s, 'تذكير بدعاء السفر في الرحلات الطويلة', 'travel');
  if (prefs.travel) opts(s, [[50, 'بعد 50 كم'], [80, 'بعد 80 كم'], [100, 'بعد 100 كم']], prefs.travelKm, function (k) { prefs.travelKm = k; upd(); }, true);
}

/* ===== تبويب التطبيقات والسيارة ===== */
function renderApps(){
  var s = section('التطبيقات');
  [['maps', 'تطبيق الخرائط', 'mapsApp'], ['music', 'تطبيق الموسيقى', 'musicApp'], ['radio', 'تطبيق الراديو FM', 'radioApp']].forEach(function (x) {
    var l = el('div', 'line');
    l.appendChild(el('span', '', x[1] + ':'));
    l.appendChild(el('span', 'v', appLabel(prefs[x[2]])));
    var b = el('a', 'opt sm', 'تغيير'); b.href = 'apps.html?pick=' + x[0]; b.style.display = 'flex'; b.style.alignItems = 'center'; b.style.marginRight = 'auto';
    l.appendChild(b);
    s.appendChild(l);
  });

  s = section('التحكم بالموسيقى من الرئيسية', 'أندرويد يتطلب تفعيل «الوصول إلى الإشعارات» لرفيق الطريق حتى نعرض اسم المقطع ونتحكم بالتشغيل. لا نقرأ محتوى إشعاراتك.');
  var m = natJSON('media');
  var l = el('div', 'line');
  l.appendChild(el('span', '', 'الحالة:'));
  l.appendChild(el('span', 'v', !HAS_NATIVE ? 'داخل التطبيق فقط' : (m && m.access ? 'مُفعَّل ✓' : 'غير مُفعَّل')));
  var b = el('button', 'opt sm', 'فتح الإعداد'); b.style.marginRight = 'auto'; b.onclick = function () { nat('openNotificationAccess'); };
  l.appendChild(b); s.appendChild(l);

  s = section('السيارة');
  var r = el('div', 'opts');
  [['maintenance.html', 'الصيانة والتجديدات'], ['fuel.html', 'سجل الوقود'], ['log.html', 'سجل الرحلات'], ['trip.html', 'الرحلة والقبلة'], ['notes.html', 'الملاحظات'], ['reminders.html', 'التذكيرات'], ['radio.html', 'الراديو'], ['parking.html', 'موقف السيارة'], ['upload.html', 'الإرسال من الجوال']].forEach(function (x) {
    var a = el('a', 'opt', x[1]); a.href = x[0]; a.style.display = 'flex'; a.style.alignItems = 'center'; r.appendChild(a);
  });
  s.appendChild(r);
}

function confirmBox(text, onYes){
  var ov = el('div'); ov.style.cssText = 'position:absolute;inset:0;z-index:70;background:rgba(5,10,25,.88);display:flex;align-items:center;justify-content:center';
  var box = el('div', 'glass section'); box.style.cssText = 'width:620px;padding:28px;gap:18px;background:rgba(10,25,55,.97)';
  box.appendChild(el('span', 'label', text));
  var r = el('div', 'opts');
  var y = el('button', 'opt on', 'نعم، نفّذ'); y.onclick = function () { ov.remove(); onYes(); };
  var n = el('button', 'opt', 'إلغاء'); n.onclick = function () { ov.remove(); };
  r.appendChild(y); r.appendChild(n); box.appendChild(r); ov.appendChild(box);
  document.getElementById('stage').appendChild(ov);
}
var UI_KEYS = ['layout', 'homes', 'dock', 'dockLabels', 'statusIcons', 'favApps', 'font', 'clockFont', 'duaFont', 'theme', 'restBg', 'autoNight', 'nightTheme',
  'brand', 'subBrands', 'brandText', 'brandSize', 'solid', 'restStyle', 'restShow', 'duaSec', 'h24', 'digits', 'remPlace'];
function renderSystem(){
  var s;
  s = section('');
  var ab = el('a', 'line'); ab.href = 'about.html';
  ab.appendChild(el('span', '', 'حول التطبيق'));

  side: '<div style="display:flex;gap:4px;height:100%"><div style="display:flex;flex-direction:column;gap:3px;width:16%"><b></b><b></b><b></b><b></b></div><div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3px"><i></i><i></i><i></i><i></i></div></div>',

function homesCopy(){ return JSON.parse(JSON.stringify(getHomes(prefs))); }
function saveHomes(h){ prefs.homes = h; upd(); }
function cardName(id){ var c = CARD_CATALOG.filter(function (x) { return x[0] === id; })[0]; return c ? c[1] : id; }
function renderHome(){
  var s = section('تصميم الواجهة');
  var g = el('div', 'themes');
  LAYOUTS.forEach(function (L) {
    var b = el('button', 'tile' + (prefs.layout === L[0] ? ' on' : ''));
    b.style.cssText = 'height:120px;background:#0e1c38;flex-direction:column;align-items:stretch;justify-content:space-between;padding:10px';
    b.innerHTML = '<div class="prev" style="flex:1;min-height:0">' + LAYOUT_PREV[L[0]] + '</div><span style="text-align:center;font-size:16px;margin-top:6px">' + L[1] + '</span>';
    b.onclick = function () { prefs.layout = L[0]; pageIdx = 0; upd(); };
    g.appendChild(b);
  });
  s.appendChild(g);
  s.appendChild(el('span', 'note', 'كل تصميم يحفظ ترتيب بطاقاته. اسحب الرئيسية يميناً أو يساراً للتنقل بين الصفحات.'));

  var homes = homesCopy(), pages = homes[prefs.layout];
  if (pageIdx >= pages.length) pageIdx = 0;
  var cards = pages[pageIdx];
  s = section('الصفحات والبطاقات');
  if (prefs.layout !== 'minimal') {
    var pr = el('div', 'opts');
    pages.forEach(function (p, i) { var b = el('button', 'opt sm' + (i === pageIdx ? ' on' : ''), 'صفحة ' + (i + 1)); b.onclick = function () { pageIdx = i; render(); }; pr.appendChild(b); });
    if (pages.length < 4) { var ad = el('button', 'opt sm', '+ صفحة'); ad.onclick = function () { pages.push([{ id: 'clock', size: 'm' }]); pageIdx = pages.length - 1; saveHomes(homes); }; pr.appendChild(ad); }
    if (pages.length > 1) { var dl = el('button', 'opt sm', 'حذف هذه الصفحة'); dl.onclick = function () { pages.splice(pageIdx, 1); pageIdx = 0; saveHomes(homes); }; pr.appendChild(dl); }
    s.appendChild(pr);
  } else s.appendChild(el('span', 'note', 'التصميم البسيط: ساعة كبيرة وحتى 3 بطاقات صغيرة.'));

  var cap = prefs.layout === 'classic' ? 4 : prefs.layout === 'minimal' ? 3 : 12;
  var used = prefs.layout === 'classic' || prefs.layout === 'minimal' ? cards.length : cards.reduce(function (a, c) { return a + ({ s: 2, m: 3, l: 4 }[c.size] || 3); }, 0);
  cards.forEach(function (c, i) {
    var row = el('div', 'line');
    row.appendChild(el('span', '', cardName(c.id)));
    var sz = el('div', 'opts'); sz.style.marginRight = 'auto';
    if (prefs.layout !== 'minimal') [['s', 'صغير'], ['m', 'متوسط'], ['l', 'كبير']].forEach(function (z) {
      var b = el('button', 'opt sm' + (c.size === z[0] ? ' on' : ''), z[1]); b.onclick = function () { c.size = z[0]; saveHomes(homes); }; sz.appendChild(b);
    });
    var up = el('button', 'opt sm', '▲'); up.setAttribute('aria-label', 'تقديم'); up.disabled = i === 0; up.onclick = function () { cards.splice(i - 1, 0, cards.splice(i, 1)[0]); saveHomes(homes); };
    var dn = el('button', 'opt sm', '▼'); dn.setAttribute('aria-label', 'تأخير'); dn.disabled = i === cards.length - 1; dn.onclick = function () { cards.splice(i + 1, 0, cards.splice(i, 1)[0]); saveHomes(homes); };
    var rm = el('button', 'opt sm', '×'); rm.setAttribute('aria-label', 'حذف البطاقة'); rm.onclick = function () { cards.splice(i, 1); saveHomes(homes); };
    sz.appendChild(up); sz.appendChild(dn); sz.appendChild(rm);
    row.appendChild(sz); s.appendChild(row);
  });
  s.appendChild(el('span', 'note', used >= cap ? 'الصفحة ممتلئة. صغّر بطاقة أو أضف صفحة جديدة.' : 'إضافة بطاقة:'));
  if (used < cap) {
    var addr = el('div', 'opts');
    CARD_CATALOG.forEach(function (c) {
      if (cards.some(function (x) { return x.id === c[0]; })) return;
      var b = el('button', 'opt sm', '+ ' + c[1]); b.onclick = function () { cards.push({ id: c[0], size: prefs.layout === 'classic' ? 'm' : 's' }); saveHomes(homes); };
      addr.appendChild(b);
    });
    s.appendChild(addr);
  }
  var rs = el('button', 'opt sm', 'استعادة الترتيب الافتراضي لهذا التصميم');

  s.appendChild(rs);

  s = section('القائمة السفلية', 'حتى 8 أزرار. زر الإعدادات ثابت دائماً.');
  var dock = (prefs.dock || []).slice();

  var DN = { maps: 'الخرائط', music: 'الموسيقى', radio: 'الراديو', apps: 'التطبيقات', rest: 'الاستراحة', azkar: 'الأذكار', trip: 'الرحلة', prayer: 'الصلاة', notes: 'الملاحظات', reminders: 'التذكيرات', parking: 'الموقف', fuel: 'الوقود', maint: 'الصيانة', settings: 'الإعدادات' };
  dock.forEach(function (id, i) {
    var row = el('div', 'line');
    row.appendChild(el('span', '', id.indexOf('app:') === 0 ? appLabel(id.slice(4)) : (DN[id] || id)));
    var o = el('div', 'opts'); o.style.marginRight = 'auto';
    var up = el('button', 'opt sm', '▲'); up.disabled = i === 0; up.onclick = function () { dock.splice(i - 1, 0, dock.splice(i, 1)[0]); prefs.dock = dock; upd(); };
    var dn = el('button', 'opt sm', '▼'); dn.disabled = i === dock.length - 1; dn.onclick = function () { dock.splice(i + 1, 0, dock.splice(i, 1)[0]); prefs.dock = dock; upd(); };
    o.appendChild(up); o.appendChild(dn);
    if (id !== 'settings') { var rm = el('button', 'opt sm', '×'); rm.onclick = function () { dock.splice(i, 1); prefs.dock = dock; upd(); }; o.appendChild(rm); }
    row.appendChild(o); s.appendChild(row);
  });
  if (dock.length < 8) {
    s.appendChild(el('span', 'note', 'إضافة زر:'));
    var ad2 = el('div', 'opts');
    Object.keys(DN).forEach(function (k) {
      if (dock.indexOf(k) >= 0) return;
      var b = el('button', 'opt sm', '+ ' + DN[k]); b.onclick = function () { dock.splice(dock.length - 1, 0, k); prefs.dock = dock; upd(); }; ad2.appendChild(b);
    });
    var ap = el('a', 'opt sm', '+ تطبيق من الشاشة'); ap.href = 'apps.html?pick=dock'; ap.style.display = 'flex'; ap.style.alignItems = 'center'; ad2.appendChild(ap);
    s.appendChild(ad2);
  }
  toggle(s, 'إظهار أسماء الأزرار', 'dockLabels');

  s = section('أيقونات الحالة بجوار الساعة', 'تعرض الحالة الحقيقية، والضغط عليها يفتح إعدادها في الشاشة.');
  var si = Object.assign({ bt: true, wifi: true, gps: true }, prefs.statusIcons || {});
  var so = el('div', 'opts');
  [['bt', 'البلوتوث'], ['wifi', 'الواي فاي'], ['gps', 'GPS']].forEach(function (x) {
    var b = el('button', 'opt sm' + (si[x[0]] ? ' on' : ''), x[1]); b.onclick = function () { si[x[0]] = !si[x[0]]; prefs.statusIcons = si; upd(); }; so.appendChild(b);
  });
  s.appendChild(so);

function render(){
  var t = document.getElementById('tabs'); t.innerHTML = '';
  TABS.forEach(function (x) {
    var b = el('button', 'tab' + (tab === x[0] ? ' on' : ''), x[1]);
    b.onclick = function () { tab = x[0]; try { sessionStorage.setItem('settings.tab', tab); } catch (e) {} document.getElementById('body').scrollTop = 0; render(); };
    t.appendChild(b);
  });
  var body = document.getElementById('body'), y = body.scrollTop;
  body.innerHTML = '';
  if (tab === 'prayer') renderPrayer(); else if (tab === 'apps') renderApps(); else if (tab === 'system') renderSystem(); else if (tab === 'home') renderHome(); else if (tab === 'restT') renderRest(); else renderLook();
  body.scrollTop = y;
}
