<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>الإعدادات</title>
<link rel="stylesheet" href="common.css">
<style>
.top{display:flex;align-items:center;gap:16px;height:60px;padding:26px 40px 0}
.title{font-size:28px;font-weight:600;margin:0}
.body{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px 40px 20px;box-sizing:border-box;min-height:0;overflow-y:auto}
.section{padding:14px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.label{font-size:20px;font-weight:600}
.opts{display:flex;gap:12px;flex-wrap:wrap}
.opt{height:58px;padding:0 22px;border-radius:18px;background:#13254a;border:1px solid #23406f;font-size:19px}
.opt.on{background:#1F5FD1;border:1.5px solid #6FA8FF;font-weight:700}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{height:84px;border-radius:16px;background-size:cover;background-position:center;border:3px solid transparent;position:relative;font-size:17px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center;padding:8px}
.tile.on{border-color:#2F7BFF}
.toggle{display:flex;justify-content:space-between;align-items:center;font-size:20px}
.sw{width:64px;height:36px;border-radius:18px;background:#2a3a58;border:none;position:relative}
.sw.on{background:#2F7BFF}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:14px;background:#fff;transition:left .15s}
.sw.on::after{left:32px}
.note{font-size:16px;color:#9FB0CC}
.opt.sm{height:48px;font-size:17px;padding:0 18px}
.txt{height:56px;width:360px;border-radius:16px;border:1px solid #23406f;background:#0e1c38;color:#fff;font:inherit;font-size:20px;padding:0 16px;box-sizing:border-box}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" src="bg/home_mountain.jpg" alt="">
  <div class="shade"></div>
  <div class="wrap">
    <div class="top">
      <a class="icon-btn" href="index.html" aria-label="العودة للرئيسية"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></a>
      <h1 class="title">الإعدادات</h1>
    </div>
    <div class="body">
      <div class="glass section">
        <span class="label">اسم السيارة أعلى الشاشة</span>
        <div class="opts" id="brands"></div>
        <div class="opts" id="brandExtra"></div>
        <span class="note" id="subNote">ماركات تظهر بجانب الاسم:</span>
        <div class="opts" id="subBrands"></div>
        <span class="note">الحجم:</span>
        <div class="opts" id="sizes"></div>
        <input type="file" id="logoFile" accept="image/*" style="display:none">
      </div>
      <div class="glass section">
        <span class="label">الخلفية</span>
        <div class="themes" id="themes"></div>
      </div>
      <div class="glass section">
        <span class="label">المدينة (لمواقيت الصلاة)</span>
        <div class="opts" id="cities"></div>
      </div>
      <div class="glass section">
        <span class="label">الخط</span>
        <div class="opts" id="fonts"></div>
      </div>
      <div class="glass section">
        <div class="toggle">
          <span>بطاقات مصمتة (بدون ضبابية)</span>
          <button class="sw" id="solid" role="switch" aria-label="بطاقات مصمتة"></button>
        </div>
        <span class="note">مفيد للأجهزة القديمة (Android 9) أو لتحسين الوضوح.</span>
      </div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
var prefs = loadPrefs();
applyPrefs('home', prefs);

function renderAll(){
  var th = document.getElementById('themes');
  th.innerHTML = '';
  Object.keys(THEMES).forEach(function (k) {
    var t = THEMES[k];
    var b = document.createElement('button');
    b.className = 'tile' + (prefs.theme === k ? ' on' : '');
    b.style.backgroundImage = "url('" + t.bg + "')";
    b.textContent = t.label;
    b.onclick = function () { prefs.theme = k; savePrefs(prefs); renderAll(); applyPrefs('home', prefs); };
    th.appendChild(b);
  });
  var fo = document.getElementById('fonts');
  fo.innerHTML = '';
  [['thmanyah', 'ثمنية سانس'], ['system', 'خط الجهاز']].forEach(function (f) {
    var b = document.createElement('button');
    b.className = 'opt' + (prefs.font === f[0] ? ' on' : '');
    b.textContent = f[1];
    b.onclick = function () { prefs.font = f[0]; savePrefs(prefs); renderAll(); applyPrefs('home', prefs); };
    fo.appendChild(b);
  });
  var co = document.getElementById('cities');
  co.innerHTML = '';
  Object.keys(CITIES).forEach(function (k) {
    var b = document.createElement('button');
    b.className = 'opt' + (prefs.city === k ? ' on' : '');
    b.textContent = CITIES[k].label;
    b.onclick = function () { prefs.city = k; savePrefs(prefs); renderAll(); applyPrefs('home', prefs); };
    co.appendChild(b);
  });
  renderBrandSettings();
  var sw = document.getElementById('solid');
  sw.className = 'sw' + (prefs.solid ? ' on' : '');
  sw.setAttribute('aria-checked', prefs.solid ? 'true' : 'false');
}
document.getElementById('solid').onclick = function () { prefs.solid = !prefs.solid; savePrefs(prefs); renderAll(); applyPrefs('home', prefs); };
function upd(){ savePrefs(prefs); renderAll(); applyPrefs('home', prefs); }
function btn(cls, label, on, fn){ var b = document.createElement('button'); b.className = cls + (on ? ' on' : ''); b.textContent = label; b.onclick = fn; return b; }
function renderBrandSettings(){
  var br = document.getElementById('brands'); br.innerHTML = '';
  Object.keys(BRANDS).forEach(function (k) { br.appendChild(btn('opt', BRANDS[k].label, prefs.brand === k, function () { prefs.brand = k; upd(); })); });
  br.appendChild(btn('opt', 'اسم مخصص', prefs.brand === 'text', function () { prefs.brand = 'text'; upd(); }));
  br.appendChild(btn('opt', 'صورة من الجهاز', prefs.brand === 'image', function () { document.getElementById('logoFile').click(); }));
  br.appendChild(btn('opt', 'بدون', prefs.brand === 'none', function () { prefs.brand = 'none'; upd(); }));

  var ex = document.getElementById('brandExtra'); ex.innerHTML = '';
  if (prefs.brand === 'text') {
    var inp = document.createElement('input'); inp.className = 'txt'; inp.maxLength = 24; inp.placeholder = 'اكتب الاسم'; inp.value = prefs.brandText || '';
    inp.oninput = function () { prefs.brandText = inp.value; savePrefs(prefs); applyPrefs('home', prefs); };
    ex.appendChild(inp);
  }
  if (prefs.brand === 'image' && loadLogo()) {
    ex.appendChild(btn('opt sm', 'تغيير الصورة', false, function () { document.getElementById('logoFile').click(); }));
    ex.appendChild(btn('opt sm', 'حذف الصورة', false, function () { saveLogo(''); prefs.brand = 'toyota'; upd(); }));
  }

  var showSub = prefs.brand !== 'none' && prefs.brand !== 'image';
  document.getElementById('subNote').style.display = showSub ? '' : 'none';
  var sb = document.getElementById('subBrands'); sb.innerHTML = ''; sb.style.display = showSub ? '' : 'none';
  Object.keys(BRANDS).filter(function (k) { return k !== prefs.brand; }).forEach(function (k) {
    var on = (prefs.subBrands || []).indexOf(k) >= 0;
    sb.appendChild(btn('opt sm', BRANDS[k].label, on, function () {
      var a = (prefs.subBrands || []).slice(); var i = a.indexOf(k);
      if (i >= 0) a.splice(i, 1); else a.push(k);
      prefs.subBrands = a; upd();
    }));
  });

  var sz = document.getElementById('sizes'); sz.innerHTML = '';
  [['s', 'صغير'], ['m', 'متوسط'], ['l', 'كبير']].forEach(function (z) {
    sz.appendChild(btn('opt sm', z[1], (prefs.brandSize || 'm') === z[0], function () { prefs.brandSize = z[0]; upd(); }));
  });
}
document.getElementById('logoFile').onchange = function (e) {
  var f = e.target.files && e.target.files[0]; if (!f) return;
  resizeImage(f, function (d) {
    if (d && saveLogo(d)) { prefs.brand = 'image'; upd(); }
    e.target.value = '';
  });
};
renderAll();
fitStage();
</script>
</body>
</html>
