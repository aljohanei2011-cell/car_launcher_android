<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>رفيق الطريق</title>
<link rel="stylesheet" href="common.css">
<style>
/* ===== الهيكل ===== */
.top{display:flex;align-items:center;gap:16px;height:56px;padding:22px 40px 0;position:relative;z-index:3}
.right{display:flex;align-items:center;gap:14px;min-width:0}
.left{display:flex;align-items:center;gap:14px;min-width:0;flex:none}
.status{display:flex;align-items:center;gap:12px}
.st{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0}
.st svg{width:26px;height:26px}
.st.off{opacity:.35}
.clockTop{font-size:26px;font-weight:600;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:flex;align-items:center;gap:10px;height:44px;padding:0 8px 0 16px;border-radius:22px;background:rgba(232,192,97,.18);border:1.5px solid rgba(232,192,97,.7);color:#FFE6A8;font-size:17px;max-width:300px}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip button{width:32px;height:32px;border-radius:16px;border:none;background:#E8C061;color:#3a2a05;font-size:18px;font-weight:700;flex:none}
.center{flex:1;min-width:0;display:flex;justify-content:center}
.banner{height:46px;padding:0 20px;border-radius:23px;background:rgba(80,50,10,.85);border:1.5px solid #E8C061;display:none;align-items:center;font-size:17px;color:#FFE6A8;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}

.body{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:18px;box-sizing:border-box}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;padding:0 40px}
#dock{order:2}
.L-side .body{flex-direction:row;gap:18px;padding:18px 40px 0}
.L-side .main{padding:0}
.L-side #dock{order:-1}
#pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
#pages::-webkit-scrollbar{display:none}
.page{flex:none;width:100%;height:100%;scroll-snap-align:start;box-sizing:border-box}
.dots{height:20px;display:flex;justify-content:center;align-items:center;gap:8px}
.dots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.35)}
.dots i.on{width:22px;background:#fff}

/* ===== التصاميم ===== */
.cards{height:100%;box-sizing:border-box}
.L-classic .cards{display:flex;gap:20px}
.L-classic .card.s{flex:.7}.L-classic .card.m{flex:1}.L-classic .card.l{flex:1.45}
.L-grid .cards,.L-side .cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));grid-auto-rows:0;gap:16px;overflow:hidden}
.L-grid .card.s,.L-side .card.s{grid-column:span 2}.L-grid .card.m,.L-side .card.m{grid-column:span 3}.L-grid .card.l,.L-side .card.l{grid-column:span 4}
.L-minimal .cards{display:flex;gap:16px;height:190px;margin-top:auto}
.L-minimal .card{flex:1}
.minClock{display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;flex:1}
.L-minimal .minClock{display:flex}
.L-minimal .page{display:flex;flex-direction:column}

/* حجم الخط داخل البطاقة يتبع حجمها والتصميم */
.card{--fs:17px;font-size:var(--fs);padding:1.3em 1.4em;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;min-width:0;min-height:0;overflow:hidden;color:#fff;position:relative}
.L-classic .card.s{--fs:15px}.L-classic .card.l{--fs:19px}
.L-grid .card,.L-side .card{--fs:13px;padding:1.1em 1.3em}
.L-grid .card.l,.L-side .card.l{--fs:14.5px}
.L-side .card{--fs:14px}.L-side .card.l{--fs:16px}
.L-minimal .card{--fs:12px;padding:1em 1.2em}
.k-row{display:flex;justify-content:space-between;align-items:center;gap:.6em;min-width:0}
.k-lbl{font-size:1.15em;color:#5AB0FF;font-weight:600;white-space:nowrap}
.k-sub{font-size:1.1em;color:#C3D1E8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-mid{font-size:1.7em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-big{font-size:3em;font-weight:700;line-height:1;direction:ltr;white-space:nowrap}
.k-huge{font-size:6.6em;font-weight:700;line-height:1;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
.k-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;height:100%;text-align:center}
.k-btn{height:2.8em;padding:0 1.1em;border-radius:1em;background:rgba(19,37,74,.85);border:1px solid #2b4a80;font-size:1em;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:.4em;flex:none}
.k-list{display:flex;flex-direction:column;gap:.35em;min-height:0;overflow:hidden}
.k-li{display:flex;justify-content:space-between;align-items:center;font-size:1.15em;padding:.25em .5em;border-radius:.6em}
.k-li.on{background:rgba(232,192,97,.2);color:#FFE6A8;font-weight:700}
.k-clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;font-size:1.25em;line-height:1.55}
.mbtn{flex:none;width:3.6em;height:3.6em;border-radius:50%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;padding:0}
.mbtn.big{width:4.3em;height:4.3em;background:#2F7BFF;border-color:#6FA8FF}
.mbtn svg{width:1.6em;height:1.6em}
.fav{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em;flex:1;min-height:0;align-content:center}
.fav button{display:flex;flex-direction:column;align-items:center;gap:.3em;background:none;border:none;color:#fff;font-size:.95em;min-width:0}
.fav img{width:3.4em;height:3.4em;border-radius:.8em}
.fav span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge{width:100%;flex:1;min-height:0}

/* ===== القائمة (Dock) ===== */
#dock{display:flex;gap:14px;box-sizing:border-box}
.L-classic #dock,.L-grid #dock,.L-minimal #dock{height:150px;padding:20px 40px 30px}
.L-side #dock{flex-direction:column;width:118px;padding:0 0 18px;flex:none;order:-1;overflow-y:auto;scrollbar-width:none;gap:10px}
.L-side #dock::-webkit-scrollbar{display:none}
.L-side #dock{gap:8px}
.L-side .dk{flex:0 0 auto;min-height:56px;max-height:96px;height:calc((100% - (var(--n,7) - 1) * 8px) / var(--n,7))}
.L-side #dock.tight .dk span{font-size:12px}
.dk{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:500;border:none;color:#fff;min-width:0;min-height:0;padding:4px}
.dk svg,.dk img{width:48px;height:48px;border-radius:12px}
.dk span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dock.many .dk{font-size:17px;gap:8px}
#dock.many .dk svg,#dock.many .dk img{width:40px;height:40px}
.L-side .dk{gap:3px;font-size:13px;padding:2px 4px}
.L-side .dk svg,.L-side .dk img{width:32px;height:32px}
.nolabels .dk span{display:none}

.boot{position:absolute;inset:0;z-index:20;background:rgba(5,10,25,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.boot .t{font-family:'Alyamama','Thmanyah',serif;font-size:46px;line-height:1.7;max-width:1000px}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" alt="">
  <script>(function(){var b=document.getElementById('bg'),s=null,c='';try{s=localStorage.getItem('carlauncher.bg.home');c=localStorage.getItem('carlauncher.bodycls')||'';}catch(e){}if(s)b.src=s;if(c)document.body.className+=' '+c;})();</script>
  <div class="shade"></div>
  <div id="wx" aria-hidden="true"></div>
  <div class="boot" id="boot" onclick="this.style.display='none'">
    <div style="color:#F2C879;font-size:22px">دعاء الركوب</div>
    <div class="t">سبحان الذي سخّر لنا هذا وما كنا له مقرنين، وإنا إلى ربنا لمنقلبون</div>
    <div class="sub" style="font-size:18px">اضغط للإغلاق</div>
  </div>
  <div class="wrap" id="wrap">
    <div class="top">
      <div class="right"><div class="logo" id="brand" aria-label="اسم السيارة"></div></div>
      <div class="center"><a class="banner" id="banner" href="maintenance.html"></a></div>
      <div class="left">
        <span class="clockTop" id="clockTop" ondblclick="openRest()"></span>
        <div class="status" id="status"></div>
        <div id="remChip"></div>
      </div>
    </div>
    <div class="body" id="body">
      <nav id="dock"></nav>
      <div class="main">
        <div id="pages"></div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
var prefs = loadPrefs();
applyPrefs('home', prefs);

/* ================= التصاميم والصفحات الافتراضية ================= */
function homePages(){ return getHomes(prefs)[prefs.layout] || getHomes(prefs).classic; }

/* ================= أيقونات ================= */
var IC = {
  maps: '<svg viewBox="0 0 24 24"><path d="M12 2 20 21 12 17 4 21Z" fill="#3B9DFF"/></svg>',
  music: '<svg viewBox="0 0 24 24" fill="none" stroke="#FF4FA3" stroke-width="2.2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3" fill="#FF4FA3"/><circle cx="18" cy="16" r="3" fill="#FF4FA3"/></svg>',
  apps: '<svg viewBox="0 0 24 24" fill="#B79CFF"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
  rest: '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="#FFD24A"/></svg>',
  azkar: '<svg viewBox="0 0 24 24" fill="none" stroke="#5AD1A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>',
  trip: '<svg viewBox="0 0 24 24" fill="none" stroke="#8FD3C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M3 13l2-6h14l2 6v5h-3v-2H6v2H3z"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="#5AB0FF" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
  radio: '<svg viewBox="0 0 24 24" fill="none" stroke="#FF9F5A" stroke-width="2" stroke-linecap="round"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8 17 3"/><circle cx="15.5" cy="14" r="2.5"/><path d="M6.5 12h3M6.5 15h3"/></svg>',
  notes: '<svg viewBox="0 0 24 24" fill="none" stroke="#FFD24A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4M8 12h8M8 16h6"/></svg>',
  reminders: '<svg viewBox="0 0 24 24" fill="none" stroke="#E8C061" stroke-width="2" stroke-linecap="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  prayer: '<svg viewBox="0 0 24 24" fill="none" stroke="#F2C879" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10M4 6h2M19 21V10M18 6h2M8 21v-5a4 4 0 0 1 8 0v5M8.5 13.5c0-2 1.6-3.5 3.5-3.5s3.5 1.5 3.5 3.5"/></svg>',
  parking: '<svg viewBox="0 0 24 24" fill="none" stroke="#6FA8FF" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M10 16V8h3a2.5 2.5 0 0 1 0 5h-3" stroke-linecap="round"/></svg>',
  fuel: '<svg viewBox="0 0 24 24" fill="none" stroke="#5AD1A0" stroke-width="2" stroke-linecap="round"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/><path d="M7 7h4"/></svg>',
  maint: '<svg viewBox="0 0 24 24" fill="none" stroke="#9FB0CC" stroke-width="2" stroke-linecap="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>'
};
var DOCK_ITEMS = {
  maps: { label: 'الخرائط', go: function () { openRole('maps'); } },
  music: { label: 'الموسيقى', go: function () { openRole('music'); } },
  radio: { label: 'الراديو', href: 'radio.html' },
  apps: { label: 'التطبيقات', href: 'apps.html' },
  rest: { label: 'الاستراحة', go: function () { openRest(); } },
  azkar: { label: 'الأذكار', href: 'azkar.html' },
  trip: { label: 'الرحلة', href: 'trip.html' },
  prayer: { label: 'الصلاة', href: 'prayer.html' },
  notes: { label: 'الملاحظات', href: 'notes.html' },
  reminders: { label: 'التذكيرات', href: 'reminders.html' },
  parking: { label: 'الموقف', href: 'parking.html' },
  fuel: { label: 'الوقود', href: 'fuel.html' },
  maint: { label: 'الصيانة', href: 'maintenance.html' },
  settings: { label: 'الإعدادات', href: 'settings.html' }
};
var appCache = {};
/* أسماء وأيقونات التطبيقات تُحفظ محلياً، فلا نسأل النظام عنها في كل فتح للرئيسية (كان يسبب تعليقاً) */
var APP_CACHE_KEY = 'carlauncher.appcache';
var appStore = lsGet(APP_CACHE_KEY, {});
function appInfo(pkg){
  if (appCache[pkg]) return appCache[pkg];
  var s = appStore[pkg];
  if (s && s.icon && Date.now() - (s.at || 0) < 7 * 86400000) { appCache[pkg] = s; return s; }
  var a = (natJSON('apps') || []).filter(function (x) { return x.pkg === pkg; })[0];
  var info = { label: a ? a.label : pkg.split('.').pop(), icon: nat('appIcon', pkg) || '', at: Date.now() };
  appCache[pkg] = info;
  if (info.icon) { appStore[pkg] = info; lsSet(APP_CACHE_KEY, appStore); }
  return info;
}
/* ===== الصفحات (الاستراحة، الإعدادات، التطبيقات...) تُفتح كنافذة فوق الرئيسية =====
   فلا تُعاد الرئيسية من الصفر عند الرجوع: لا وميض ولا شاشة خلفية مؤقتة، والرجوع فوري */
var _ovl = null;
function openPage(url){
  if (document.getElementById('restFrame')) return;
  var f = document.createElement('iframe');
  f.id = 'restFrame'; f.src = url;
  _ovl = { rest: /^rest\.html/.test(url), digits: prefs.digits, h24: prefs.h24 };
  document.getElementById('stage').appendChild(f);
  // نخفي الرئيسية خلف النافذة حتى لا تستهلك الذاكرة والرسم
  setTimeout(function () { if (restOpen()) { document.getElementById('wrap').style.visibility = 'hidden'; var bg = document.getElementById('bg'); if (bg.getAttribute('src')) { bg.dataset.src = bg.getAttribute('src'); bg.removeAttribute('src'); } var wx = document.getElementById('wx'); if (wx) { wx.innerHTML = ''; _wxCur = null; } } }, 800);
}
window.openPage = openPage;
function openRest(q){ openPage('rest.html' + (q || '')); }
window.closeRest = function () {
  var f = document.getElementById('restFrame');
  if (f) { try { f.src = 'about:blank'; } catch (e) {} f.remove(); }
  var o = _ovl || {}; _ovl = null;
  nat('keepOn', false);
  lastTouch = Date.now();
  var np = loadPrefs();
  // تغيير الأرقام أو صيغة الساعة يحتاج إعادة رسم كاملة للنصوص
  if (!o.rest && (np.digits !== o.digits || np.h24 !== o.h24)) { location.reload(); return; }
  document.getElementById('wrap').style.visibility = '';
  var bg = document.getElementById('bg'); if (bg.dataset.src) { bg.src = bg.dataset.src; delete bg.dataset.src; }
  if (o.rest) { renderWeatherFx(); forceCards = true; tick(); forceCards = false; }
  else { _imgs = null; window.onPageResume(); }
};
function restOpen(){ return !!document.getElementById('restFrame'); }
window.addEventListener('message', function (e) {
  if (!e.data) return;
  if (e.data.rafiq === 'closeRest') window.closeRest();
  else if (e.data.rafiq === 'reloadHome') location.reload();
});
/* زر الرجوع في الجهاز */
window.onBack = function () {
  var f = document.getElementById('restFrame');
  if (!f) return false;
  try { f.contentWindow.postMessage({ rafiq: 'back' }, '*'); } catch (e) { window.closeRest(); }
  return true;
};
/* روابط الصفحات داخل الرئيسية تُفتح كنافذة */
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href]');
  if (!a) return;
  var h = a.getAttribute('href') || '';
  if (/^javascript:/i.test(h) || /(^|\/)index\.html/.test(h) || !/\.html(\?|#|$)/.test(h) || /^[a-z]+:\/\//i.test(h)) return;
  e.preventDefault(); openPage(h);
}, true);
function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

function renderDock(){
  var d = document.getElementById('dock'); d.innerHTML = '';
  var items = (prefs.dock || []).slice();
  if (items.indexOf('settings') < 0) items.push('settings');
  items.forEach(function (id) {
    var b = document.createElement('button'); b.className = 'glass dk';
    if (id.indexOf('app:') === 0) {
      var pkg = id.slice(4), a = appInfo(pkg);
      b.innerHTML = (a.icon ? '<img alt="" src="' + a.icon + '">' : IC.apps) + '<span>' + esc(a.label) + '</span>';
      b.onclick = function () { nat('launch', pkg); };
    } else {
      var it = DOCK_ITEMS[id]; if (!it) return;
      b.innerHTML = (IC[id] || IC.apps) + '<span>' + it.label + '</span>';
      b.onclick = it.go || function () { openPage(it.href); };
    }
    d.appendChild(b);
  });
  document.getElementById('wrap').classList.toggle('nolabels', !prefs.dockLabels);
  d.classList.toggle('many', d.children.length > 7);
  d.style.setProperty('--n', d.children.length);
  d.classList.toggle('tight', d.children.length > 7);
}

/* ================= أيقونات الحالة ================= */
var SI = {
  bt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>',
  wifi: function (lvl) {
    var c = function (i) { return lvl >= i ? 'currentColor' : 'rgba(255,255,255,.25)'; };
    return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0" stroke="' + c(3) + '"/><path d="M5 12a10 10 0 0 1 14 0" stroke="' + c(2) + '"/><path d="M8.5 15.5a5 5 0 0 1 7 0" stroke="' + c(1) + '"/><circle cx="12" cy="19" r="1.4" fill="' + c(0) + '"/></svg>';
  },
  gps: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>'
};
function renderStatus(){
  var el = document.getElementById('status'), si = Object.assign({ bt: true, wifi: true, gps: true }, prefs.statusIcons || {});
  if (!HAS_NATIVE) { el.innerHTML = si.bt ? '<span class="st off" style="color:#fff">' + SI.bt + '</span>' : ''; return; }
  var s = natJSON('status') || {}, t = natJSON('trip') || {};
  var html = '';
  if (si.gps) html += '<button class="st' + (t.gps ? '' : ' off') + '" style="color:' + (t.gps ? '#5AD1A0' : '#fff') + '" onclick="nat(\'openSystem\',\'gps\')" aria-label="GPS ' + (t.gps ? 'متصل' : 'يبحث') + '">' + SI.gps + '</button>';
  if (si.wifi) html += '<button class="st' + (s.wifi ? '' : ' off') + '" style="color:' + (s.internet ? '#fff' : '#F2C879') + '" onclick="nat(\'openSystem\',\'wifi\')" aria-label="واي فاي">' + SI.wifi(s.wifi ? (s.wifiLevel == null ? 3 : s.wifiLevel) : -1) + '</button>';
  if (si.bt) html += '<button class="st' + (s.bt === 'connected' || s.bt === 'on' ? '' : ' off') + '" style="color:' + (s.bt === 'connected' ? '#6FA8FF' : '#fff') + '" onclick="nat(\'openSystem\',\'bt\')" aria-label="بلوتوث">' + SI.bt + '</button>';
  el.innerHTML = html;
}

/* ================= البطاقات ================= */
var CARDS = {};

function skinImg(kind, key){
  if (prefs.skin === 'gold') return kind === 'prayer' ? 'skins/gold/prayer_' + (key || 'isha') + '.jpg' : 'skins/gold/music.jpg';
  if (prefs.skin === 'red') return kind === 'prayer' ? 'skins/red/prayer.jpg' : kind === 'trip' ? 'skins/red/trip.jpg' : 'skins/red/music.jpg';
  if (fancySkin() && kind === 'prayer') return 'skins/cards/prayer_' + (key || 'isha') + '.jpg';
  return '';
}

function fancySkin(){ return !!prefs.skin && prefs.skin !== 'classic' && !!SKINS[prefs.skin]; }
function isLight(){ return prefs.skin === 'light'; }
function fgCol(){ return isLight() ? '#13202f' : '#fff'; }
function accentCol(def){ var v = ''; try { v = getComputedStyle(document.body).getPropertyValue('--accent').trim(); } catch (e) {} return v || def; }

card('speed', 'عداد السرعة', function () {
  var t = natJSON('trip') || {}, v = t.gps ? Math.round(t.speed) : 0, max = 200;
  var lim = +prefs.speedLimit || 120, over = prefs.speedOn && v > lim;
  var a = -120 + 240 * Math.min(v, max) / max;
  function pt(deg, r){ var rad = (deg - 90) * Math.PI / 180; return (100 + r * Math.cos(rad)).toFixed(1) + ' ' + (105 + r * Math.sin(rad)).toFixed(1); }
  var arc = function (from, to, col, w){ var large = (to - from) > 180 ? 1 : 0; return '<path d="M' + pt(from, 80) + ' A80 80 0 ' + large + ' 1 ' + pt(to, 80) + '" fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/>'; };
  var ticks = '';
  for (var k = 0; k <= max; k += 20) { var dg = -120 + 240 * k / max; ticks += '<text x="' + pt(dg, 62).split(' ')[0] + '" y="' + (+pt(dg, 62).split(' ')[1] + 4) + '" fill="#9FB0CC" font-size="9" text-anchor="middle">' + k + '</text>'; }
  var limDeg = -120 + 240 * Math.min(lim, max) / max;
  if (prefs.skin === 'red') {
    var pc = Math.min(v, max) / max, C = 2 * Math.PI * 70;
    return '<div class="k-row"><span class="k-lbl">السرعة</span><span class="k-sub" style="font-size:.95em">' + (t.gps ? 'GPS' : 'بانتظار GPS') + '</span></div>' +
      '<div style="position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center"><div style="position:relative;height:100%;aspect-ratio:1;max-width:100%">' +
      '<img src="skins/red/ring.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain">' +
      '<svg viewBox="0 0 200 200" style="position:absolute;inset:0;width:100%;height:100%"><circle cx="100" cy="100" r="70" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/>' +
      '<circle cx="100" cy="100" r="70" fill="none" stroke="' + (over ? '#F02A48' : '#C8102E') + '" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + (C * pc).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(135 100 100)" style="filter:drop-shadow(0 0 4px #F02A48)"/>' +
      '<text x="100" y="108" text-anchor="middle" fill="#fff" font-size="44" font-weight="700">' + v + '</text><text x="100" y="132" text-anchor="middle" fill="#B7BEC5" font-size="12">كم/س</text></svg></div></div>';
  }
  var main = prefs.skin === 'gold' && !prefs.accent ? (over ? '#FF6B5A' : 'url(#gg)') : (over ? '#FF6B5A' : accentCol('#5AB0FF'));
  var trackC = isLight() ? 'rgba(0,0,0,.12)' : 'rgba(255,255,255,.15)', fg = fgCol();
  return '<div class="k-row"><span class="k-lbl">السرعة</span><span class="k-sub" style="font-size:.95em">' + (t.gps ? 'GPS' : 'بانتظار GPS') + '</span></div>' +
    '<svg class="gauge" viewBox="0 0 200 150" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8a6420"/><stop offset=".6" stop-color="#E6B85C"/><stop offset="1" stop-color="#F5D58A"/></linearGradient></defs>' + arc(-120, 120, trackC, 10) + arc(-120, a, main, 10) +
    (prefs.speedOn ? '<path d="M' + pt(limDeg, 70) + ' L' + pt(limDeg, 90) + '" stroke="#E8C061" stroke-width="3"/>' : '') + ticks +
    '<g transform="rotate(' + a + ' 100 105)"><path d="M100 30 L104 105 L96 105Z" fill="' + (over ? '#FF6B5A' : prefs.skin === 'gold' ? '#F5D58A' : fg) + '"/></g><circle cx="100" cy="105" r="7" fill="' + fg + '"/>' +
    '<text x="100" y="140" text-anchor="middle" fill="' + (over ? '#FF6B5A' : fg) + '" font-size="26" font-weight="700">' + v + '</text></svg>';
});

function buildPages(){
  var stage = document.getElementById('stage');
  stage.classList.remove('L-classic', 'L-grid', 'L-side', 'L-minimal');
  stage.classList.add('L-' + prefs.layout);
  var pagesEl = document.getElementById('pages'); pagesEl.innerHTML = ''; cardEls = [];
  var pages = homePages();
  if (prefs.layout === 'minimal') pages = pages.slice(0, 1);
  pages.forEach(function (cards, pi) {
    var pg = document.createElement('div'); pg.className = 'page';
    if (prefs.layout === 'minimal') {
      pg.innerHTML = '<div class="minClock" ondblclick="openRest()"><div class="sub" id="minDate" style="font-size:24px"></div><div id="minClock" class="font-clock" style="font-size:150px;font-weight:700;line-height:1;direction:ltr;font-variant-numeric:tabular-nums"></div><div class="sub" id="minPrayer" style="font-size:26px"></div></div>';
      cards = cards.slice(0, 3);
    }
    var wrap = document.createElement('div'); wrap.className = 'cards';
    cards.forEach(function (c) {
      if (!CARDS[c.id]) return;
      var el = document.createElement('div'); el.className = 'glass card ' + (c.size || 'm');
      wrap.appendChild(el); cardEls.push({ el: el, id: c.id, html: '' });
    });
    pg.appendChild(wrap);
    pagesEl.appendChild(pg);
  });
  var dots = document.getElementById('dots'); dots.innerHTML = '';
  if (pages.length > 1) pages.forEach(function () { dots.appendChild(document.createElement('i')); });
  updateDots();
}
function updateDots(){
  var p = document.getElementById('pages'), w = p.clientWidth || 1;
  var idx = Math.round(Math.abs(p.scrollLeft) / w);
  [].forEach.call(document.getElementById('dots').children, function (d, i) { d.classList.toggle('on', i === idx); });
}
document.getElementById('pages').addEventListener('scroll', function () { clearTimeout(this._t); this._t = setTimeout(updateDots, 80); });

var forceCards = false;
/* تصغير خط البطاقة حتى يتسع محتواها بالكامل (بدون قص) في أي تصميم وحجم */
function overflows(el){ return el.scrollHeight > el.clientHeight + 2 || el.scrollWidth > el.clientWidth + 2 || [].some.call(el.querySelectorAll('.k-huge,.k-big'), function (x) { return x.scrollWidth > x.clientWidth + 2; }); }
function fitCard(c){
  var el = c.el;
  if (!c.baseFs || c.fitN > 40) { el.style.fontSize = ''; c.baseFs = parseFloat(getComputedStyle(el).fontSize); c.fs = c.baseFs; c.fitN = 0; }
  c.fitN++;
  el.style.fontSize = c.fs + 'px';
  var guard = 0;
  while (overflows(el) && c.fs > 7 && guard++ < 14) { c.fs = Math.max(7, c.fs * 0.9); el.style.fontSize = c.fs + 'px'; }
}
window.addEventListener('resize', function () { cardEls.forEach(function (c) { c.baseFs = 0; fitCard(c); }); });
function renderCards(){
  // لا نعيد رسم البطاقات أثناء اللمس حتى لا تضيع الضغطة
  if (Date.now() - touchAt < 700) return;
  var now = Date.now();
  cardEls.forEach(function (c) {
    if (c.at && now - c.at < cardRate(c.id) * 1000 - 100 && !forceCards) return;
    c.at = now;
    var h = '';
    try { h = CARDS[c.id].render(); } catch (e) { h = '<span class="k-lbl">' + CARDS[c.id].label + '</span><div class="k-sub">تعذّر العرض</div>'; }
    if (h !== c.html) { c.el.innerHTML = h; c.html = h; fitCard(c); }
  });
}

/* ================= الشريط العلوي: التذكيرات ================= */
var bannerItems = [], bannerIdx = 0;
function renderBanner(){
  var due = [];
  loadMaint().forEach(function (it) { if (maintStatus(it).due) due.push(it.name); });
  bannerItems = [];
  if (due.length) bannerItems.push({ t: 'تذكير الصيانة: ' + due.join('، '), href: 'maintenance.html' });
  if (prefs.reminders && prefs.remPlace === 'banner') hijriReminders().forEach(function (r) { bannerItems.push({ t: r, href: 'azkar.html' }); });
  var us = natJSON('updateState');
  if (us && us.phase === 'available') bannerItems.unshift({ t: 'يوجد تحديث جديد (الإصدار ' + us.latest + ') — اضغط للتحديث', href: 'update.html' });
  if (HAS_NATIVE && nat('isDefaultHome') === false) bannerItems.unshift({ t: 'اضغط هنا لجعل رفيق الطريق الواجهة الافتراضية', href: 'javascript:nat(\'makeDefaultHome\')' });
  showBanner();
}
function showBanner(){
  var b = document.getElementById('banner');
  if (!bannerItems.length) { b.style.display = 'none'; return; }
  var it = bannerItems[bannerIdx % bannerItems.length];
  b.textContent = it.t; b.href = it.href; b.style.display = 'flex';
}
setInterval(function () { bannerIdx++; showBanner(); }, 8000);
function renderRemChip(){
  var el = document.getElementById('remChip'), a = activeReminders(), html = '';
  if (a.length) html = '<div class="chip"><span>' + esc(a[0].text) + (a.length > 1 ? ' (+' + (a.length - 1) + ')' : '') + '</span><button aria-label="تم" onclick="dismissReminder(\'' + a[0].id + '\');renderRemChip()">✓</button></div>';
  else if (prefs.reminders && prefs.remPlace === 'clock') { var s = hijriReminders(); if (s.length) html = '<div class="chip" style="padding-left:16px"><span>' + esc(s[0]) + '</span></div>'; }
  if (el.innerHTML !== html) el.innerHTML = html;
}

/* ================= عند التشغيل / الإضاءة / الاستراحة التلقائية ================= */
function bootAction(){
  var id = nat('bootId'); if (id === null) return;
  var last = null; try { last = localStorage.getItem('carlauncher.lastBoot'); } catch (e) {}
  if (String(last) === String(id)) return;
  try { localStorage.setItem('carlauncher.lastBoot', String(id)); } catch (e) {}
  if (prefs.ramOnBoot) setTimeout(function () { nat('freeRam'); }, 20000);
  var a = prefs.bootAction;
  if (a === 'dua') { var o = document.getElementById('boot'); o.style.display = 'flex'; setTimeout(function () { o.style.display = 'none'; }, 10000); }
  else if (a === 'maps') setTimeout(function () { openRole('maps'); }, 1500);
  else if (a === 'music') setTimeout(function () { nat('mediaKey', 'play'); }, 4000);
  else if (a === 'dua_music') { var o2 = document.getElementById('boot'); o2.style.display = 'flex'; setTimeout(function () { o2.style.display = 'none'; nat('mediaKey', 'play'); }, 8000); }
}
/* طبقة الطقس فوق الخلفية (مطر، سحب، غبار، ضباب، حر) — صورة واحدة صغيرة، وتتوقف في وضع الأداء */
var _wxCur = null;
function renderWeatherFx(){
  var box = document.getElementById('wx'); if (!box) return;
  var fx = (prefs.weatherFx && prefs.weatherOn && !isLight() && !document.body.classList.contains('perf')) ? weatherFx(weatherData()) : '';
  document.body.classList.toggle('wx-heavy', fx === 'dust' || fx === 'fog');
  if (fx === _wxCur) return;
  _wxCur = fx;
  box.className = fx ? 'fx-' + fx : '';
  box.innerHTML = fx ? '<img alt="" src="skins/weather/' + fx + '.jpg">' : '';
}
function applyBrightness(){ if (prefs.nightBright) nat('applyNight', isNight(), +prefs.nightPct); else nat('applyNight', false, 100); }

var lastTouch = Date.now(), touchAt = 0, stoppedSince = 0, movedSinceStop = false;
document.addEventListener('pointerdown', function () { lastTouch = touchAt = Date.now(); }, true);
function autoRest(){
  var mode = prefs.restAuto, min = (+prefs.restAutoMin || 5) * 60000, now = Date.now();
  if (mode === 'manual') return;
  if (mode === 'idle' && now - lastTouch > min) openRest('?auto=1');
  if (mode === 'night' && isNight() && now - lastTouch > min) openRest('?auto=1');
  if (mode === 'stopped') {
    var t = natJSON('trip'); if (!t || !t.gps) return;
    if (t.speed > 5) { movedSinceStop = true; stoppedSince = 0; return; }
    if (!stoppedSince) stoppedSince = now;
    if (movedSinceStop && now - stoppedSince > min && now - lastTouch > 30000) { movedSinceStop = false; openRest('?auto=1'); }
  }
}

/* ================= التحديث الدوري ================= */
function tick(){
  var d = new Date();
  document.getElementById('clockTop').textContent = clockStr(d) + (ampm(d) ? ' ' + ampm(d) : '');
  if (prefs.layout === 'minimal') {
    var mc = document.getElementById('minClock'); if (mc) {
      mc.textContent = clockStr(d);
      document.getElementById('minDate').textContent = fmt({ weekday: 'long', day: 'numeric', month: 'long' }, 'ar-u-nu-latn', d) + ' · ' + fmt({ day: 'numeric', month: 'long', year: 'numeric' }, 'ar-SA-u-ca-islamic-umalqura-nu-latn', d);
      var np = nextPrayer(d); document.getElementById('minPrayer').textContent = np.name + ' ' + np.timeFmt + ' · ' + fmtDiff(np.diff);
    }
  }
  renderCards(); renderRemChip();
}
window.onPageResume = function () { var of = document.getElementById('restFrame'); if (of && _ovl && !_ovl.rest) { try { of.contentWindow.postMessage({ rafiq: 'resume' }, '*'); } catch (e) {} return; } forceCards = true; setTimeout(function () { forceCards = false; }, 50); prefs = loadPrefs(); _prefsCache = null; applyPrefs('home', prefs); _wxCur = null; renderWeatherFx(); buildPages(); renderDock(); tick(); renderBanner(); renderStatus(); applyBrightness(); lastTouch = Date.now(); };

/* كل خطوة مستقلة: لو تعطلت واحدة تُسجَّل في سجل الأعطال وتكمل البقية، فلا تبقى الشاشة فارغة */
function safe(name, fn){ try { fn(); } catch (e) { nat('logError', 'index/' + name + ': ' + (e && e.message)); } }
safe('inbox', processInbox); safe('pages', buildPages); safe('dock', renderDock); safe('status', renderStatus);
safe('tick', tick); safe('banner', renderBanner); safe('boot', bootAction); safe('bright', applyBrightness); safe('weather', weatherRefreshIfStale); safe('wx', renderWeatherFx);
setInterval(function () { if (!document.hidden && !restOpen()) tick(); }, 1000);
setInterval(function () { if (!document.hidden) renderStatus(); }, 5000);
autoDetectPerf();
/* البحث عن تحديث بهدوء كل 6 ساعات عند توفر الإنترنت */
function autoUpdateCheck(){
  if (!HAS_NATIVE) return;
  var s = natJSON('status') || {}, last = +(lsGet('carlauncher.updChecked', 0));
  if (s.internet && Date.now() - last > 6 * 3600000) { lsSet('carlauncher.updChecked', Date.now()); nat('updateCheck'); setTimeout(renderBanner, 8000); }
}
setTimeout(autoUpdateCheck, 15000);
setInterval(autoUpdateCheck, 10 * 60000);
setInterval(function () { processInbox(); updatePlaceReminders(); if (!restOpen()) autoRest(); }, 5000);
setInterval(function () { if (!restOpen()) { applyPrefs('home', prefs); renderWeatherFx(); } pushPrayerSchedule(); pushReminderAlarms(); renderBanner(); applyBrightness(); weatherRefreshIfStale(); }, 60000);
fitStage();
</script>
