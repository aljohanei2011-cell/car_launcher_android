<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>رفيق الطريق</title>
<link rel="stylesheet" href="common.css">
<style>
.row{display:flex;align-items:center;justify-content:space-between;height:56px;padding:26px 40px 0}
.status{display:flex;align-items:center;gap:22px;font-size:26px;font-weight:500}
.cards{display:flex;gap:20px;flex:1;min-height:0;padding:22px 40px 0;box-sizing:border-box}
.card{padding:26px 28px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
.apps{display:flex;gap:16px;height:150px;padding:22px 40px 34px;box-sizing:border-box}
.app{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:24px;font-weight:500}
.app svg{width:56px;height:56px}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" src="bg/home_mountain.jpg" alt="">
  <div class="shade"></div>
  <div class="wrap">
    <div class="row">
      <div class="logo" id="brand" aria-label="اسم السيارة"></div>
      <div class="status">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="بلوتوث"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
        <span id="clockTop" style="direction:ltr;font-variant-numeric:tabular-nums"></span>
      </div>
    </div>

    <div class="cards">
      <div class="glass card" style="flex:1.35;align-items:center;justify-content:center;gap:4px">
        <div id="dateLine" class="sub" style="font-size:22px"></div>
        <div id="clock" style="font-size:124px;font-weight:700;line-height:1.05;direction:ltr;font-variant-numeric:tabular-nums"></div>
        <div id="hijri" class="sub" style="font-size:22px"></div>
      </div>
      <div class="glass card" style="flex:1">
        <div style="display:flex;flex-direction:column;gap:6px">
          <span class="accent" style="font-size:20px">الطقس</span>
          <span id="weatherCity" style="font-size:24px">الظهران</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:flex-end">
          <span class="sub" style="font-size:22px">صافٍ</span>
          <span style="font-size:76px;font-weight:700;line-height:1;direction:ltr">35°</span>
        </div>
      </div>
      <a class="glass card" href="prayer.html" style="flex:1;color:inherit">
        <span class="accent" style="font-size:20px">الصلاة القادمة</span>
        <div style="display:flex;flex-direction:column;gap:2px">
          <span id="nextName" style="font-size:40px;font-weight:600"></span>
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <span id="untilText" class="sub" style="font-size:20px"></span>
            <span id="nextTime" style="font-size:52px;font-weight:700;direction:ltr"></span>
          </div>
        </div>
      </a>
    </div>

    <nav class="apps">
      <div class="glass app" role="button" tabindex="0"><svg viewBox="0 0 24 24"><path d="M12 2 20 21 12 17 4 21Z" fill="#3B9DFF"/></svg><span>الخرائط</span></div>
      <div class="glass app" role="button" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="#FF4FA3" stroke-width="2.2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3" fill="#FF4FA3"/><circle cx="18" cy="16" r="3" fill="#FF4FA3"/></svg><span>الموسيقى</span></div>
      <a class="glass app" href="rest.html"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="#FFD24A"/></svg><span>الاستراحة</span></a>
      <a class="glass app" href="azkar.html"><svg viewBox="0 0 24 24" fill="none" stroke="#5AD1A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg><span>الأذكار</span></a>
      <a class="glass app" href="trip.html"><svg viewBox="0 0 24 24" fill="none" stroke="#8FD3C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M3 13l2-6h14l2 6v5h-3v-2H6v2H3z"/></svg><span>الرحلة</span></a>
      <a class="glass app" href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="#5AB0FF" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>الإعدادات</span></a>
    </nav>
  </div>
</div>

<script src="common.js"></script>
<script>
var prefs = loadPrefs();
applyPrefs('home', prefs);
function tick(){
  var d = new Date();
  var clk = (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = clk;
  document.getElementById('clockTop').textContent = clk;
  document.getElementById('dateLine').textContent = fmt({ weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }, 'ar-u-nu-latn', d);
  document.getElementById('hijri').textContent = fmt({ day: 'numeric', month: 'long', year: 'numeric' }, 'ar-SA-u-ca-islamic-umalqura-nu-latn', d);
  var np = nextPrayer(d);
  document.getElementById('nextName').textContent = np.name;
  document.getElementById('nextTime').textContent = np.time;
  document.getElementById('untilText').textContent = 'بعد ' + Math.floor(np.diff / 60) + ' س ' + (np.diff % 60) + ' د';
}
tick();
setInterval(tick, 15000);
fitStage();
</script>
</body>
</html>
