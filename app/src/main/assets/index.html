<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>رفيق الطريق</title>
<link rel="stylesheet" href="common.css">
<style>
/* ===== الهيكل ===== */
.top{display:flex;align-items:center;gap:16px;height:56px;padding:22px 40px 0;position:relative;z-index:3}
.right{display:flex;align-items:center;gap:14px;min-width:0}
.left{display:flex;align-items:center;gap:14px;min-width:0;flex:none}
.status{display:flex;align-items:center;gap:12px}
.st{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0}
.st svg{width:26px;height:26px}
/* أحجام أيقونات الشريط العلوي: مساحة اللمس أكبر من الأيقونة */
/* زرا الأوامر (تحدّث، إغلاق): وحدهما بجوار اسم السيارة، بعيداً عن الساعة */
.acts{display:flex;align-items:center;gap:24px;margin-right:26px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:70px;height:58px;padding:0 10px;border-radius:18px;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:13px;font-weight:600;flex:none}
.act svg{width:24px;height:24px}
.act.mic{border-color:rgba(111,168,255,.75);background:rgba(47,123,255,.22)}
.dk-voice{border-color:rgba(111,168,255,.75)!important}.dk-voice.on{box-shadow:0 0 0 4px rgba(47,123,255,.35),0 0 18px rgba(47,123,255,.6)!important}
.act.mic.on{box-shadow:0 0 0 4px rgba(47,123,255,.35),0 0 18px rgba(47,123,255,.6)}
.act.cls{border-color:rgba(255,120,110,.6);background:rgba(255,90,80,.12)}
body.skin-light .act{color:#13202f;border-color:rgba(19,32,47,.3)}body.skin-light .act svg{stroke:#13202f}
.status.sz-s{gap:16px}.status.sz-s .st{width:44px;height:44px}
.status.sz-m{gap:22px}.status.sz-m .st{width:56px;height:52px;border-radius:16px}.status.sz-m .st svg{width:30px;height:30px}
.status.sz-l{gap:26px}.status.sz-l .st{width:70px;height:60px;border-radius:18px}.status.sz-l .st svg{width:36px;height:36px}
/* أشكال الأيقونات: مربعات، بدون خلفية، كبسولة، دوائر، مع الاسم، خط حالة */
.status.ic-pill .st{background:rgba(255,255,255,.08)}
.status.ic-circle .st{border-radius:50%!important;border:1.5px solid rgba(255,255,255,.32);background:rgba(255,255,255,.06);width:52px!important;height:52px!important}
.status.ic-capsule{gap:0;padding:2px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06)}
.status.ic-capsule .st+.st{border-right:1px solid rgba(255,255,255,.22);border-radius:0}
body.skin-lux .status.ic-capsule{border-color:rgba(231,199,122,.55)}body.skin-luxblue .status.ic-capsule{border-color:rgba(127,179,255,.5)}
.status.ic-label .st{flex-direction:column;gap:2px;width:auto!important;min-width:56px;padding:0 6px}.status.ic-label .st small{font-size:11px;color:inherit;opacity:.85;white-space:nowrap}
.status.ic-line .st{position:relative}.status.ic-line .st::after{content:'';position:absolute;bottom:3px;left:50%;width:18px;margin-left:-9px;height:3px;border-radius:2px;background:currentColor}
.status:empty{display:none}
/* أثناء القيادة تخفت، وتظهر بحركة هادئة عند تغيّر الحالة */
.status{transition:opacity .4s}.status.drv{opacity:.4}
.st{animation:stIn .3s ease-out}
@keyframes stIn{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:none}}

.st.off{opacity:.35}
.clockTop{font-size:26px;font-weight:600;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:flex;align-items:center;gap:10px;height:44px;padding:0 8px 0 16px;border-radius:22px;background:rgba(232,192,97,.18);border:1.5px solid rgba(232,192,97,.7);color:#FFE6A8;font-size:17px;max-width:300px}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip button{width:32px;height:32px;border-radius:16px;border:none;background:#E8C061;color:#3a2a05;font-size:18px;font-weight:700;flex:none}
.center{flex:1;min-width:0;display:flex;justify-content:center}
.banner{height:46px;padding:0 20px;border-radius:23px;background:rgba(80,50,10,.85);border:1.5px solid #E8C061;display:none;align-items:center;font-size:17px;color:#FFE6A8;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}

.body{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:18px;box-sizing:border-box}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;padding:0 40px}
#dock{order:2}
.L-side .body{flex-direction:row;gap:18px;padding:18px 40px 0}
.L-side .main{padding:0}
.L-side #dock{order:-1}
#pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
#pages::-webkit-scrollbar{display:none}
.hpage{flex:none;width:100%;height:100%;scroll-snap-align:start;box-sizing:border-box}
.dots{height:20px;display:flex;justify-content:center;align-items:center;gap:8px}
.dots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.35)}
.dots i.on{width:22px;background:#fff}

/* ===== التصاميم ===== */
.cards{height:100%;box-sizing:border-box}
.L-classic .cards{display:flex;gap:var(--cg,26px)}
.L-classic .card.s{flex:.7}.L-classic .card.m{flex:1}.L-classic .card.l{flex:1.45}
.L-grid .cards,.L-side .cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));grid-auto-rows:0;gap:var(--cgg,20px);overflow:hidden}
.L-grid .card.s,.L-side .card.s{grid-column:span 2}.L-grid .card.m,.L-side .card.m{grid-column:span 3}.L-grid .card.l,.L-side .card.l{grid-column:span 4}
.L-minimal .cards{display:flex;gap:var(--cgg,20px);height:190px;margin-top:auto}
.L-minimal .card{flex:1}
.minClock{display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;flex:1}
.L-minimal .minClock{display:flex}
.L-minimal .hpage{display:flex;flex-direction:column}

/* حجم الخط داخل البطاقة يتبع حجمها والتصميم */
.card{--fs:17px;font-size:var(--fs);padding:calc(var(--fs)*1.3) calc(var(--fs)*1.4);box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;min-width:0;min-height:0;overflow:hidden;color:#fff;position:relative}
.L-classic .card.s{--fs:15px}.L-classic .card.l{--fs:19px}
.L-grid .card,.L-side .card{--fs:13px;padding:calc(var(--fs)*1.1) calc(var(--fs)*1.3)}
.L-grid .card.l,.L-side .card.l{--fs:14.5px}
.L-side .card{--fs:14px}.L-side .card.l{--fs:16px}
.L-minimal .card{--fs:12px;padding:var(--fs) calc(var(--fs)*1.2)}
.k-row{display:flex;justify-content:space-between;align-items:center;gap:.6em;min-width:0}
.k-lbl{font-size:1.15em;color:#5AB0FF;font-weight:600;white-space:nowrap}
.k-sub{font-size:1.1em;color:#C3D1E8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-mid{font-size:1.7em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-big{font-size:3em;font-weight:700;line-height:1;direction:ltr;white-space:nowrap}
.k-huge{font-size:6.6em;font-weight:700;line-height:1;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
.k-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;height:100%;text-align:center}
.k-btn{height:2.8em;padding:0 1.1em;border-radius:1em;background:rgba(19,37,74,.85);border:1px solid #2b4a80;font-size:1em;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:.4em;flex:none}
.k-list{display:flex;flex-direction:column;gap:.35em;min-height:0;overflow:hidden}
.k-li{display:flex;justify-content:space-between;align-items:center;font-size:1.15em;padding:.25em .5em;border-radius:.6em}
.k-li.on{background:rgba(232,192,97,.2);color:#FFE6A8;font-weight:700}
.k-clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;font-size:1.25em;line-height:1.55}
.mbtn{flex:none;width:3.6em;height:3.6em;border-radius:50%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;padding:0}
.mbtn.big{width:4.3em;height:4.3em;background:#2F7BFF;border-color:#6FA8FF}
.mbtn svg{width:1.6em;height:1.6em}
.fav{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em;flex:1;min-height:0;align-content:center}
.fav button{display:flex;flex-direction:column;align-items:center;gap:.3em;background:none;border:none;color:#fff;font-size:.95em;min-width:0}
.fav img{width:3.4em;height:3.4em;border-radius:.8em}
.fav span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge{width:100%;flex:1;min-height:0}
/* لا تحديد للنص ولا قائمة عند الضغط المطوّل (حتى يعمل تحرير البطاقات) */
#stage{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* خيارات البطاقة: المحاذاة والشفافية */
.card.al-c{text-align:center}.card.al-c .k-row{justify-content:center;gap:1em}
.card.op-clear{background:rgba(0,0,0,.16)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-color:rgba(255,255,255,.18)!important;box-shadow:none!important}
.card.op-solid{background:#0d1a33!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
body.skin-light .card.op-solid{background:#fff!important}
body.skin-saudi .card.op-solid{background:#072A1E!important}
body.skin-gold .card.op-solid{background:#0f1d30!important}
body.skin-red .card.op-solid{background:#16191e!important}
/* ساعة الأرقام المتقلبة */
body.skin-light .flip .fl{background:rgba(255,255,255,.75)}

/* المتصفحات القديمة لا تدعم المسافات داخل الصفوف (gap): نستبدلها بهوامش */
html.nogap .L-classic .cards>.card+.card,html.nogap .L-minimal .cards>.card+.card{margin-right:var(--cg,26px)}
html.nogap #dock>.dk+.dk{margin-right:var(--dg,20px)}
html.nogap .L-side #dock>.dk+.dk{margin-right:0;margin-top:8px}
html.nogap .status>*+*{margin-right:22px}html.nogap .acts>*+*{margin-right:24px}
html.nogap .top>*+*,html.nogap .left>*+*,html.nogap .right>*+*{margin-right:16px}
html.nogap .galert>*+*{margin-right:14px}

/* ===== القائمة (Dock) ===== */
#dock{display:flex;gap:var(--dg,20px);box-sizing:border-box}
.L-classic #dock,.L-grid #dock,.L-minimal #dock{height:150px;padding:var(--dtop,24px) 40px 30px}
.L-side #dock{flex-direction:column;width:118px;padding:0 0 18px;flex:none;order:-1;overflow-y:auto;scrollbar-width:none;gap:10px}
.L-side #dock::-webkit-scrollbar{display:none}
.L-side #dock{gap:8px}
.L-side .dk{flex:0 0 auto;min-height:56px;max-height:96px;height:calc((100% - (var(--n,7) - 1) * 8px) / var(--n,7))}
.L-side #dock.tight .dk span{font-size:12px}
.dk{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:500;border:none;color:#fff;min-width:0;min-height:0;padding:4px}
.dk svg,.dk img{width:48px;height:48px;border-radius:12px}
.dk span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dock.many .dk{font-size:17px;gap:8px}
#dock.many .dk svg,#dock.many .dk img{width:40px;height:40px}
.L-side .dk{gap:3px;font-size:13px;padding:2px 4px}
.L-side .dk svg,.L-side .dk img{width:32px;height:32px}
.nolabels .dk span{display:none}

.boot{position:absolute;top:0;right:0;bottom:0;left:0;z-index:20;background:rgba(5,10,25,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.boot .t{font-family:'Alyamama','Thmanyah',serif;font-size:46px;line-height:1.7;max-width:1000px}
</style>
</head>

  <img id="bg" alt="">

<script>
/* وضع الأمان: إن تعذّر فتح الواجهة 3 مرات متتالية نفتح صفحة الإصلاح بدل التعليق */
(function () { try { var n = +(localStorage.getItem('carlauncher.bootTry') || 0); if (n >= 3) { localStorage.setItem('carlauncher.bootTry', '0'); location.replace('safe.html'); return; } localStorage.setItem('carlauncher.bootTry', String(n + 1)); } catch (e) {} })();

<script>
/* أول تشغيل على هذه الشاشة: معالج الإعداد */
var FIRST_RUN = (function () { try { return !localStorage.getItem(PREFS_KEY) && !lsGet('carlauncher.wizardDone', 0); } catch (e) { return false; } })();
var prefs = loadPrefs();
applyPrefs('home', prefs);

/* ================= التصاميم والصفحات الافتراضية ================= */
function homePages(){ return getHomes(prefs)[prefs.layout] || getHomes(prefs).classic; }

/* ================= أيقونات ================= */
var IC = {

};
var appCache = {};
/* أسماء وأيقونات التطبيقات تُحفظ محلياً، فلا نسأل النظام عنها في كل فتح للرئيسية (كان يسبب تعليقاً) */
var APP_CACHE_KEY = 'carlauncher.appcache';
var appStore = lsGet(APP_CACHE_KEY, {});
function appInfo(pkg){
  if (appCache[pkg]) return appCache[pkg];
  var s = appStore[pkg];
