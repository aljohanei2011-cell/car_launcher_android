<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>سجل الأحداث</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="page.css">
<style>
#log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
#log::-webkit-scrollbar{display:none}
.ev{display:flex;gap:16px;padding:10px 16px;border-radius:14px;background:#0f172d;border:1px solid #1d2747;font-size:18px}
.ev time{direction:ltr;color:#9FB0CC;font-size:15px;min-width:120px;font-variant-numeric:tabular-nums}
.ev.w{border-color:#8a6a2a;background:#241c0e}
</style>
</head>
<body>
<div id="stage">
  <div class="page">
    <div class="ptop">
      <a class="icon-btn" href="index.html" aria-label="الرئيسية" style="width:48px;height:48px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></a>
      <span class="ptitle">سجل الأحداث</span>
      <span class="pnote" style="margin-right:16px">الأحدث في الأعلى. صوّر هذه الصفحة وأرسلها عند أي مشكلة.</span>
      <button class="pbtn g" id="clr" style="margin-right:auto">مسح السجل</button>
    </div>
    <div class="pcard" style="flex:1"><div id="log"></div></div>
  </div>
</div>
<script src="common.js"></script>
<script>
var prefs = loadPrefs(); applyPrefs('home', prefs);
document.body.style.background = '#0a0f1f';
function render(){
  var L = document.getElementById('log'), t = (nat('events') || '').split('\n').filter(Boolean).reverse();
  L.innerHTML = t.length ? '' : '<div class="pempty">لا توجد أحداث بعد.</div>';
  t.forEach(function (line) {
    var d = document.createElement('div'); d.className = 'ev' + (/بدون لمس|من النظام|تعذّر|إعادة فتح|الذاكرة/.test(line) ? ' w' : '');
    var tm = document.createElement('time'); tm.textContent = line.slice(0, 14);
    var sp = document.createElement('span'); sp.textContent = line.slice(14).trim();
    d.appendChild(tm); d.appendChild(sp); L.appendChild(d);
  });
}
document.getElementById('clr').onclick = function () { nat('eventsClear'); render(); };
render(); setInterval(render, 5000);
fitStage();
</script>
</body>
</html>
